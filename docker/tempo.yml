stream_over_http_enabled: true

server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

# Tempo 3 separa la planificación y ejecución de la compactación/retención.
# En modo monolítico ambos componentes corren dentro del mismo proceso.
backend_scheduler:
  provider:
    retention:
      interval: 1h
    compaction:
      compaction:
        block_retention: 168h
        compacted_block_retention: 1h

backend_worker:
  compaction:
    block_retention: 168h
    compacted_block_retention: 1h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# Genera métricas RED y grafos de servicio a partir de las trazas.
metrics_generator:
  registry:
    external_labels:
      source: tempo
      environment: local
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
      generate_native_histograms: both

usage_report:
  reporting_enabled: false
