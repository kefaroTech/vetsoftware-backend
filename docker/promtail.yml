server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: vetsoftware
    static_configs:
      - targets:
          - localhost
        labels:
          job: vetsoftware
          env: local
          __path__: /logs/vetsoftware.log
    pipeline_stages:
      # Solo extraemos dimensiones de BAJA cardinalidad para usarlas como labels.
      # traceId/spanId NO se etiquetan: quedan en el contenido JSON del log y se consultan al vuelo
      # con `| json | traceId="..."`. Usarlos como labels (únicos por request/span) dispara la
      # cardinalidad — un stream por traza — y degrada el índice de Loki.
      - json:
          expressions:
            level: level
            logger: logger_name
      - labels:
          level:
          logger:
