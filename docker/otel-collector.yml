receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Protege al collector de OOM bajo picos de carga.
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128

  # Política vigente: conservar el 100% de las trazas.
  # Las reglas de errores y latencia se mantienen explícitas para facilitar una posible
  # revisión futura, pero sample-rest al 100% hace que actualmente se retengan todas:
  #   - errores (span status = ERROR) → siempre
  #   - lentas (>2s) → siempre
  #   - el resto → 100%
  tail_sampling:
    decision_wait: 10s
    num_traces: 50000
    expected_new_traces_per_sec: 100
    policies:
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      - name: slow
        type: latency
        latency:
          threshold_ms: 2000
      - name: sample-rest
        type: probabilistic
        probabilistic:
          sampling_percentage: ${env:OTEL_TAIL_SAMPLING_PERCENTAGE}

  # Agrupa spans antes de exportar (eficiencia de red).
  batch:
    timeout: 5s
    send_batch_size: 512

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  otlphttp/loki:
    endpoint: http://loki:3100/otlp

service:
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      # Orden importa: memory_limiter primero, tail_sampling antes de batch.
      processors: [memory_limiter, tail_sampling, batch]
      exporters: [otlp_grpc/tempo]
