global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  # Las reglas de SLI/SLO van primero: las alertas de burn rate consumen sus series grabadas.
  - /etc/prometheus/rules/slo-rules.yml
  - /etc/prometheus/rules/slo-alerts.yml
  - /etc/prometheus/rules/business-alerts.yml
  - /etc/prometheus/rules/platform-alerts.yml

scrape_configs:
  - job_name: vetsoftware
    metrics_path: /api/v1/actuator/prometheus
    basic_auth:
      username_file: /run/secrets/prometheus_metrics_username
      password_file: /run/secrets/prometheus_metrics_password
    static_configs:
      - targets:
          - backend:8080

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: alertmanager
    static_configs:
      - targets:
          - alertmanager:9093

  - job_name: otel-collector
    static_configs:
      - targets:
          - otel-collector:8888

  - job_name: loki
    static_configs:
      - targets:
          - loki:3100

  - job_name: tempo
    static_configs:
      - targets:
          - tempo:3200

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121

  - job_name: grafana
    static_configs:
      - targets:
          - grafana:3000
