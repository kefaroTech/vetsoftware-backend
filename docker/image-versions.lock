# Lock de imágenes del stack (OBS-024).
#
# Una línea por servicio de docker-compose.yml:
#     <servicio> <imagen>:<tag> <digest de la lista de manifiestos>
#
# El tag fijado es lo que se instala; el digest es la prueba de QUÉ se instaló. Un tag de versión
# concreta es inmutable en la práctica, pero nada impide al publicador re-empujarlo: el digest es lo
# que hace detectable ese caso.
#
# Verificar:      bash docker/tests/image-pins.sh --digests
# Regenerar:      bash docker/tests/image-pins.sh --update   (tras un cambio deliberado de versión)
#
# NO editar a mano para "arreglar" un fallo de verificación. Un digest que no coincide significa que
# el registro cambió bajo un tag que creíamos estable; eso se investiga, no se sobrescribe. El
# procedimiento de actualización controlada está en docs/MATRIZ_VERSIONES_STACK.md.

