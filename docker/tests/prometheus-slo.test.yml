              description: "El objetivo está declarado pero no existe serie de eventos en las últimas 24 horas. Revisar el selector de la regla de grabación antes que el objetivo. En un entorno local o de desarrollo, una operación que nunca se ejecutó dispara esta alerta de forma legítima."
              runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwaresloseriesabsent"
          - exp_labels:
              alertname: VetSoftwareSloSeriesAbsent
              domain: slo
              service: vetsoftware
