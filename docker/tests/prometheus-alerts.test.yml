rule_files:
  - ../prometheus-platform-alerts.yml

evaluation_interval: 1m

group_eval_order:
  - vetsoftware-availability
  - vetsoftware-http
  - vetsoftware-dependencies
  - vetsoftware-telemetry-pipeline

tests:
  - name: backend down becomes critical
    interval: 1m
    input_series:
      - series: 'up{job="vetsoftware",instance="backend:8080"}'
        values: '0x5'
    alert_rule_test:
      - eval_time: 3m
        alertname: VetSoftwareBackendDown
        exp_alerts:
          - exp_labels:
              alertname: VetSoftwareBackendDown
              domain: availability
              instance: backend:8080
              job: vetsoftware
              service: vetsoftware
              severity: critical
            exp_annotations:
              summary: "El backend de VetSoftware no responde"
              description: "Prometheus no puede extraer las métricas del backend desde hace al menos dos minutos."
              runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarebackenddown"

  - name: sustained five hundred rate with enough traffic becomes critical
    interval: 1m
    input_series:
      - series: 'http_server_requests_seconds_count{job="vetsoftware",status="200"}'
        values: '0+100x15'
      - series: 'http_server_requests_seconds_count{job="vetsoftware",status="500"}'
        values: '0+10x15'
    alert_rule_test:
      - eval_time: 12m
        alertname: VetSoftwareHttp5xxRateHigh
        exp_alerts:
          - exp_labels:
              alertname: VetSoftwareHttp5xxRateHigh
              domain: backend
              service: vetsoftware
              severity: critical
            exp_annotations:
              summary: "La tasa HTTP 5xx supera el 5 %"
              description: "El backend superó el 5 % de respuestas 5xx con al menos 20 solicitudes en cinco minutos."
              runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwarehttp5xxratehigh"

  - name: observability target down fires and then resolves
    interval: 1m
    input_series:
      - series: 'up{job="loki",instance="loki:3100"}'
        values: '1 0 0 0 1 1'
    alert_rule_test:
      - eval_time: 3m
        alertname: VetSoftwareObservabilityTargetDown
        exp_alerts:
          - exp_labels:
              alertname: VetSoftwareObservabilityTargetDown
              domain: observability
              instance: loki:3100
              job: loki
              service: vetsoftware
              severity: critical
            exp_annotations:
              summary: "Un componente de observabilidad no responde"
              description: "El target indicado por las etiquetas job e instance no puede ser consultado por Prometheus."
              runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwareobservabilitytargetdown"
      - eval_time: 4m
        alertname: VetSoftwareObservabilityTargetDown
        exp_alerts: []

  - name: database connection timeout becomes critical
    interval: 1m
    input_series:
      - series: 'hikaricp_connections_timeout_total{job="vetsoftware",instance="backend:8080",pool="HikariPool-1"}'
        values: '0 0 1 1 1 1 1 1'
    alert_rule_test:
      - eval_time: 4m
        alertname: VetSoftwareDatabaseConnectionTimeouts
        exp_alerts:
          - exp_labels:
              alertname: VetSoftwareDatabaseConnectionTimeouts
              domain: database
              instance: backend:8080
              job: vetsoftware
              pool: HikariPool-1
              service: vetsoftware
              severity: critical
            exp_annotations:
              summary: "Se agotó el tiempo esperando una conexión"
              description: "HikariCP registró al menos un timeout de conexión durante los últimos cinco minutos."
              runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwaredatabaseconnectiontimeouts"

  # Con `retry_on_failure` activo (OBS-027), un envío fallido es un reintento en curso, no pérdida.
  # La alerta exige 10 minutos de fallo sostenido y es warning, no critical.
  - name: sustained collector log export failure becomes a warning
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_send_failed_log_records{job="otel-collector",exporter="otlphttp/loki"}'
        values: '0 0 1+1x20'
    alert_rule_test:
      # A los 4 minutos todavía no debe alertar: el reintento puede resolverlo.
      - eval_time: 4m
        alertname: VetSoftwareOtelLogExportFailing
        exp_alerts: []
      - eval_time: 15m
        alertname: VetSoftwareOtelLogExportFailing
        exp_alerts:
          - exp_labels:
              alertname: VetSoftwareOtelLogExportFailing
              domain: observability
              exporter: otlphttp/loki
              job: otel-collector
              service: vetsoftware
              severity: warning
            exp_annotations:
              summary: "El Collector lleva minutos sin poder exportar logs"
              description: "Los envíos a Loki fallan de forma sostenida. Los reintentos siguen en curso y la cola en disco está creciendo; si se llena, empezará a descartar."
              runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwareotellogexportfailing"

  # El descarte por cola llena sí es pérdida consumada y sí es crítico.
  - name: queue overflow drops telemetry and becomes critical
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_enqueue_failed_log_records{job="otel-collector",exporter="otlphttp/loki"}'
        values: '0 0 5 10 15 20 25 30'
    alert_rule_test:
      - eval_time: 5m
        alertname: VetSoftwareOtelQueueDroppingTelemetry
        exp_alerts:
          - exp_labels:
              alertname: VetSoftwareOtelQueueDroppingTelemetry
              domain: observability
              service: vetsoftware
              severity: critical
            exp_annotations:
              summary: "El Collector está descartando telemetría por cola llena"
              description: "La cola de envío se llenó y se perdieron datos. Es pérdida consumada, no un reintento pendiente."
              runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwareotelqueuedroppingtelemetry"

  - name: queue near capacity warns before dropping
    interval: 1m
    input_series:
      - series: 'otelcol_exporter_queue_size{job="otel-collector",exporter="otlphttp/loki"}'
        values: '1800x10'
      - series: 'otelcol_exporter_queue_capacity{job="otel-collector",exporter="otlphttp/loki"}'
        values: '2000x10'
    alert_rule_test:
      - eval_time: 7m
        alertname: VetSoftwareOtelQueueNearCapacity
        exp_alerts:
          - exp_labels:
              alertname: VetSoftwareOtelQueueNearCapacity
              domain: observability
              exporter: otlphttp/loki
              job: otel-collector
              service: vetsoftware
              severity: warning
            exp_annotations:
              summary: "La cola de envío del Collector supera el 80 %"
              description: "El destino no drena al ritmo de entrada. Si la cola se llena, la telemetría se descartará."
              runbook: "docs/ALERTAMIENTO_OPERATIVO.md#vetsoftwareotelqueuenearcapacity"
