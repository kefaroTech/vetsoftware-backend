name: Publish SemVer release

on:
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer already merged into main (X.Y.Z)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

# Una sola declaracion del JDK: la usan `setup-java` y la clave de la cache de Maven.
# Si se separaran, un cambio de version dejaria la clave apuntando al ~/.m2 del JDK
# anterior sin que nada lo dijera. Identica a la de ci.yml, que es lo que hace que la
# entrada de cache sea la MISMA y no una por workflow.
env:
  JAVA_VERSION: "25"

concurrency:
  group: backend-publish-release-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    name: Tag and publish release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'release/'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production
    env:
      CI: true
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
      ECR_REPOSITORY: vetsoftware-backend
      RELEASE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
      RELEASE_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || format('release/{0}', inputs.version) }}

    steps:
      - name: Check out merged release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || 'main' }}
          fetch-depth: 0
          persist-credentials: true

      - name: Enforce production-only ECR publication
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Manual ECR publication is allowed only from main." >&2
            exit 1
          fi

          [[ "$(git rev-parse HEAD)" == "$RELEASE_COMMIT" ]] || {
            echo "The checked-out production commit does not match the release event." >&2
            exit 1
          }

          echo "Production artifact policy confirmed; production publishes only to vetsoftware-backend."

      - name: Validate release version
        id: release
        shell: bash
        run: |
          if [[ ! "$RELEASE_BRANCH" =~ ^release/(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "The version must match strict SemVer X.Y.Z." >&2
            exit 1
          fi
          echo "version=${RELEASE_BRANCH#release/}" >> "$GITHUB_OUTPUT"

      # Aqui vivia `cache: maven`, y tampoco acertaba nunca: `setup-java` hace coincidencia
      # exacta del hash de pom.xml, y el pom de una release declara su propia X.Y.Z, distinta
      # en cada una. Es la misma patologia que documenta ci.yml, con otra causa para el mismo
      # efecto. Lo sustituyen los dos steps siguientes.
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # La clave NO es el hash del pom tal cual: neutraliza la <version> del propio
      # proyecto -la unica linea que mueve el bump de version- y deja intacto todo lo
      # demas, que es lo que de verdad decide el contenido de ~/.m2. Asi un merge que no
      # toca dependencias acierta EXACTO y `actions/cache` se salta el guardado en vez de
      # volver a subir los mismos 200 MB.
      - name: Compute the Maven cache key
        id: m2
        shell: bash
        run: |
          set -euo pipefail

          # La <version> del proyecto es la primera que aparece DESPUES de </parent>. La
          # del <parent> y las de <dependencyManagement> si deciden el arbol y se quedan.
          normalized="$RUNNER_TEMP/pom-cache-key.xml"
          awk '
            /<\/parent>/ { after_parent = 1 }
            after_parent && !done && /<version>[^<]*<\/version>/ {
              sub(/<version>[^<]*<\/version>/, "<version>IGNORED</version>"); done = 1
            }
            { print }
          ' pom.xml > "$normalized"

          # Si el awk dejara de casar, la version volveria a entrar en la clave y el
          # fallo del 100 % regresaria en silencio, que es justo el defecto que esto cura.
          if ! grep -q '<version>IGNORED</version>' "$normalized"; then
            echo "::error file=pom.xml::No se pudo neutralizar la version del proyecto para la clave de cache de Maven"
            exit 1
          fi

          echo "key=$(sha256sum "$normalized" | cut -c1-40)" >> "$GITHUB_OUTPUT"

      # Antes del unico Maven del trabajo, el `mvn verify` completo de mas abajo. Aqui el
      # pom ya llega con la <version> de la release declarada -`release-version.mjs verify`
      # falla con "pom.xml is X, expected Y" si no coincide-, y esa es justo la linea que el
      # paso anterior neutraliza: una release que no toca dependencias acierta EXACTO contra
      # la entrada que dejo develop y `actions/cache` se salta el guardado, en vez de
      # escribir 200 MB nuevos por cada X.Y.Z.
      - name: Restore the Maven repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          # La version del JDK entra en la clave para que el `restore-keys` no arrastre
          # el ~/.m2 de un JDK anterior cuando se suba de version.
          key: m2-${{ runner.os }}-java${{ env.JAVA_VERSION }}-${{ steps.m2.outputs.key }}
          restore-keys: |
            m2-${{ runner.os }}-java${{ env.JAVA_VERSION }}-

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Verify synchronized release metadata
        run: node .github/scripts/release-version.mjs verify "${{ steps.release.outputs.version }}"

      - name: Install workflow tooling
        run: npm ci --ignore-scripts

      - name: Audit workflow tooling dependencies
        run: npm audit --audit-level=high

      - name: Verify backend before publication
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Validate AWS publication configuration
        shell: bash
        run: |
          [[ -n "$AWS_ROLE_TO_ASSUME" ]] || {
            echo "Configure AWS_ECR_PUBLISH_ROLE_ARN in the production environment." >&2
            exit 1
          }

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check release image idempotency
        id: image
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          sha_tag="sha-${RELEASE_COMMIT::12}"
          version_digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$version" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          sha_digest="$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$sha_tag" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"

          echo "sha_tag=$sha_tag" >> "$GITHUB_OUTPUT"
          if [[ -z "$version_digest" && -z "$sha_digest" ]]; then
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "$version_digest" && "$version_digest" == "$sha_digest" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "The immutable release image already exists with matching version and commit tags."
          else
            echo "ECR contains a partial or conflicting immutable release image." >&2
            exit 1
          fi

      - name: Log in to Amazon ECR
        if: steps.image.outputs.push == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      # Sigue haciendo falta aunque la imagen ya no compile nada: la etapa runtime es
      # arm64 y su `apt-get install` ejecuta binarios de esa arquitectura sobre un runner
      # amd64. Lo unico que desaparecio del Dockerfile fue la compilacion Maven.
      - name: Set up QEMU
        if: steps.image.outputs.push == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.image.outputs.push == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # El jar ya esta construido: lo dejo en target/ el `mvn verify` de mas arriba, en
      # este mismo workspace y sobre este mismo commit. Aqui no hace falta artefacto ni
      # descarga -a diferencia de publish-dev-image.yml, donde `verify` es otro job-,
      # solo mover el fichero al directorio limpio que es todo el contexto de build.
      # El `COPY` del Dockerfile apunta a una ruta exacta y no a un glob: dos jars se
      # concatenarian en el destino sin un solo aviso, asi que se comprueba que hay uno
      # y solo uno. `-name '*.jar'` ya descarta el `*.jar.original` que deja el repackage
      # de Spring Boot; los `-sources`/`-javadoc` se excluyen por si alguien activa sus
      # plugins mas adelante.
      - name: Stage the verified jar into the build context
        if: steps.image.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/docker
          mapfile -t jars < <(find target -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' | sort)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Se esperaba exactamente un jar ejecutable en target/; hay ${#jars[@]}." >&2
            printf '  %s\n' "${jars[@]+"${jars[@]}"}" >&2
            exit 1
          fi
          cp "${jars[0]}" build/docker/application.jar
          ls -l build/docker/application.jar

      - name: Build and publish immutable ARM64 image
        if: steps.image.outputs.push == 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.release.outputs.version }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.image.outputs.sha_tag }}
          labels: |
            org.opencontainers.image.revision=${{ env.RELEASE_COMMIT }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
          # Sin atestaciones el tag apunta a un manifiesto de imagen y no a un
          # index. El escaneo basico de ECR solo escanea manifiestos de
          # plataforma: con provenance y SBOM activos, el wait de mas abajo
          # habria bloqueado toda publicacion de release igual que bloqueo el
          # despliegue de desarrollo.
          provenance: false
          sbom: false
          # El jar entra por el contexto; el valor por defecto del ARG es este mismo, y
          # se declara aqui para que el workflow diga en voz alta que fichero construye.
          #
          # APP_VERSION aqui NO corrige nada: el step "Verify synchronized release
          # metadata" exige que `pom.xml` ya declare esta misma version antes del
          # `mvn verify` (release-version.mjs falla con "pom.xml is X, expected Y"), asi
          # que el valor horneado en el jar y este coinciden por construccion. Se inyecta
          # por simetria con publish-dev-image.yml: que los dos caminos declaren la version
          # explicitamente evita que el dia que alguien mueva el orden de los steps la
          # imagen vuelva a mentir en silencio en uno solo de los dos.
          # APT_SECURITY_REFRESH rompe a proposito el acierto de cache de la capa de apt.
          # El Dockerfile explica por que un acierto ahi publica una imagen con paquetes
          # viejos y el gate de escaneo de ECR acaba rechazando el despliegue.
          build-args: |
            JAR_FILE=build/docker/application.jar
            APP_VERSION=${{ steps.release.outputs.version }}
            APT_SECURITY_REFRESH=${{ github.run_id }}
          # Scope propio, separado del de desarrollo. Compartiendo `backend-arm64` una
          # release y una publicacion de develop se pisaban las capas mutuamente: cada
          # una invalidaba el acierto de la otra y ninguna llegaba a amortizar el cache.
          cache-from: type=gha,scope=backend-arm64-release
          cache-to: type=gha,mode=max,scope=backend-arm64-release

      - name: Resolve and certify immutable image digest
        id: immutable_image
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          sha_tag="${{ steps.image.outputs.sha_tag }}"
          digest="${{ steps.build.outputs.digest }}"

          if [[ -z "$digest" ]]; then
            digest="$(aws ecr describe-images \
              --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$version" \
              --query 'imageDetails[0].imageDigest' \
              --output text)"
          fi

          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "ECR did not return a valid sha256 digest." >&2
            exit 1
          }

          version_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$version" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          sha_digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$sha_tag" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"

          [[ "$digest" == "$version_digest" && "$digest" == "$sha_digest" ]] || {
            echo "The SemVer and commit tags do not resolve to the published digest." >&2
            exit 1
          }

          aws ecr wait image-scan-complete \
            --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$digest"

          scan_status="$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$digest" \
            --query 'imageScanStatus.status' \
            --output text)"
          critical="$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$digest" \
            --query 'imageScanFindings.findingSeverityCounts.CRITICAL' \
            --output text)"
          high="$(aws ecr describe-image-scan-findings \
            --repository-name "$ECR_REPOSITORY" \
            --image-id "imageDigest=$digest" \
            --query 'imageScanFindings.findingSeverityCounts.HIGH' \
            --output text)"
          [[ "$critical" == "None" || "$critical" == "null" ]] && critical=0
          [[ "$high" == "None" || "$high" == "null" ]] && high=0

          [[ "$scan_status" == "COMPLETE" && "$critical" == "0" && "$high" == "0" ]] || {
            echo "ECR scan rejected: status=$scan_status critical=$critical high=$high." >&2
            exit 1
          }

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          image_uri="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${digest}"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "image_uri=$image_uri" >> "$GITHUB_OUTPUT"
          echo "Certified immutable image: $image_uri"

      - name: Create immutable version tag
        shell: bash
        run: |
          version="${{ steps.release.outputs.version }}"
          tag="v$version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            [[ "$(git rev-list -n 1 "$tag")" == "$(git rev-parse HEAD)" ]] || {
              echo "$tag already points to a different commit." >&2
              exit 1
            }
          else
            git tag --annotate "$tag" --message "VetSoftware $version"
            git push origin "refs/tags/$tag"
          fi

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v${{ steps.release.outputs.version }}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" \
            --verify-tag \
            --generate-notes \
            --title "VetSoftware ${{ steps.release.outputs.version }}"

      # BE-27. El SBOM del artefacto que se publica, junto al artefacto que describe.
      # Lo genera el paso "Verify backend before publication" -cyclonedx va enganchado
      # a la fase package- sobre ESTE commit, asi que describe exactamente el arbol de
      # la imagen certificada mas arriba. Sin el, responder "que version de esta
      # libreria lleva la 1.7.0 que esta en produccion" obliga a reconstruir la
      # release, y cuando eso se pregunta suele ser el dia de un CVE con nombre.
      - name: Attach the SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          version="${{ steps.release.outputs.version }}"
          tag="v$version"

          [ -s target/bom.json ] || {
            echo "::error::No existe target/bom.json; la release quedaria sin lista de materiales." >&2
            exit 1
          }

          # Se copia fuera del workspace: el nombre del activo lleva la version y no
          # tiene por que ensuciar el arbol de trabajo del que cuelga el tag.
          asset="$RUNNER_TEMP/vetsoftware-${version}-sbom.cdx.json"
          cp target/bom.json "$asset"
          # --clobber: reejecutar el workflow sobre la misma release reemplaza el
          # activo en vez de fallar por nombre duplicado.
          gh release upload "$tag" "$asset" --clobber

      # Este repositorio publica el artefacto y ahi termina su responsabilidad.
      # El despliegue lo solicita VetSoftwareIaC desde su propia rama main, con
      # su propia aprobacion: ningun repositorio de aplicacion puede iniciar un
      # cambio en la infraestructura productiva.
      - name: Publish the deployment request data
        env:
          IMAGE_DIGEST: ${{ steps.immutable_image.outputs.digest }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          SOURCE_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          {
            echo "## Release publicada"
            echo
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Versión | \`${RELEASE_VERSION}\` |"
            echo "| Digest | \`${IMAGE_DIGEST}\` |"
            echo "| Commit | \`${RELEASE_COMMIT}\` |"
            echo "| Run de origen | ${SOURCE_RUN_URL} |"
            echo
            echo "Para desplegar, ejecute **Deploy backend image prod** en \`VetSoftwareIaC\`"
            echo "desde la rama \`main\` con exactamente estos cuatro valores."
          } >> "$GITHUB_STEP_SUMMARY"
