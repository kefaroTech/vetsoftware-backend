name: CodeQL

# BE-27. Analisis estatico del codigo propio con el motor de GitHub.
#
# ESTE WORKFLOW NO SE EJECUTA TODAVIA, Y NO ES UN DESCUIDO. Comprobado contra la API
# el 2026-08-19:
#
#   GET /repos/kefaroTech/vetsoftware-backend  -> "code_security": {"status": "disabled"}
#   GET /repos/kefaroTech/vetsoftware-backend/code-scanning/alerts
#       403 "Code Security must be enabled for this repository to use code scanning."
#   GET /orgs/kefaroTech -> plan "team",
#                           advanced_security_enabled_for_new_repositories: false
#
# El repositorio es privado, y en repositorios privados el code scanning exige GitHub
# Code Security, que no esta contratado. Sin el, codeql-action falla al subir el SARIF
# con ese mismo 403. Por eso el trabajo esta condicionado a la variable de repositorio
# CODE_SECURITY_ENABLED y hoy queda SIN EJECUTAR (visible como "skipped"), no en
# verde: taparlo con continue-on-error lo pintaria de verde mintiendo, y dejarlo
# corriendo lo dejaria en rojo permanente en cada pull request, que es como se enseña
# a un equipo a ignorar los checks rojos.
#
# QUE HAY QUE HACER PARA ACTIVARLO (dos pasos, ningun cambio de codigo):
#   1. Contratar y habilitar GitHub Code Security en kefaroTech/vetsoftware-backend.
#   2. Crear la variable de repositorio CODE_SECURITY_ENABLED = true
#      (Settings > Secrets and variables > Actions > Variables).
# Ese dia, este workflow entra en servicio tal cual esta y el trabajo `sast` de
# security.yml (Semgrep, que si corre hoy) puede retirarse o quedarse como segunda
# opinion.
#
# Sobre Java 25: NO es un impedimento. El extractor de Java de CodeQL soporta Java 25
# desde CodeQL 2.23.1 (septiembre de 2025) y el rango declarado hoy es Java 7-26; el
# proyecto no usa caracteristicas preview ni incubator, que son lo unico que el
# extractor no admite. build-mode: none analiza el arbol de fuentes sin compilar, con
# lo que no arrastra los minutos de un `mvn package` ni necesita Docker.
#
# ALINEACION DE LOS TRES REPOSITORIOS. Este fichero se mantiene funcionalmente
# equivalente al `codeql.yml` de vetsoftware-admin-web y vetsoftware-public-web:
# mismos disparadores (pull_request a develop/main con el mismo paths-ignore,
# barrido semanal los lunes a las 08:00 UTC y workflow_dispatch), misma condicion
# (`vars.CODE_SECURITY_ENABLED == 'true'`), mismos permisos y mismos pasos.
# Las unicas divergencias son deliberadas:
#   - `languages:` y `category:`, que nombran el lenguaje real de cada repositorio.
#   - el paso `Set up Java`, que solo tiene sentido en un repositorio Java.
#   - el prefijo de `concurrency.group`, que sigue la convencion de cada repo.
#   - el texto de los comentarios, que nombra el repositorio.
# NO hay disparador `push`: lo que se mezcla a develop llega siempre por un pull
# request que este mismo workflow ya analizo, asi que un segundo analisis del mismo
# arbol es pagar dos veces por el mismo resultado.

on:
  pull_request:
    branches:
      - develop
      - main
    # Un cambio de documentacion no puede introducir una vulnerabilidad en el codigo
    # Java: el analisis no aportaria nada y consume minutos. Mismo criterio que
    # ci.yml, y la misma lista que los dos fronts.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  # Las consultas de CodeQL se actualizan aunque el codigo no cambie.
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Una sola declaracion del JDK: la usan `setup-java` y la clave de la cache de Maven.
# Si se separaran, un cambio de version dejaria la clave apuntando al ~/.m2 del JDK
# anterior sin que nada lo dijera. Identica a la de ci.yml, que es lo que hace que la
# entrada de cache sea la MISMA y no una por workflow.
env:
  JAVA_VERSION: "25"

concurrency:
  group: backend-codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (java-kotlin)
    # El interruptor descrito arriba. Mientras no exista la variable, el trabajo no
    # arranca; el dia que exista, corre completo sin tocar este fichero.
    if: vars.CODE_SECURITY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      # La escritura de alertas de code scanning: es exactamente el permiso que hoy
      # devuelve 403 por falta de licencia.
      security-events: write
      actions: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Con build-mode: none CodeQL no compila, pero si invoca Maven para resolver el
      # arbol de dependencias y afinar la resolucion de tipos. Sin un JDK 25 esa
      # resolucion se degrada y el analisis pierde precision en silencio.
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # La clave NO es el hash del pom tal cual: neutraliza la <version> del propio
      # proyecto -la unica linea que mueve el bump de version- y deja intacto todo lo
      # demas, que es lo que de verdad decide el contenido de ~/.m2. Asi un merge que no
      # toca dependencias acierta EXACTO y `actions/cache` se salta el guardado en vez de
      # volver a subir los mismos 200 MB.
      - name: Compute the Maven cache key
        id: m2
        shell: bash
        run: |
          set -euo pipefail

          # La <version> del proyecto es la primera que aparece DESPUES de </parent>. La
          # del <parent> y las de <dependencyManagement> si deciden el arbol y se quedan.
          normalized="$RUNNER_TEMP/pom-cache-key.xml"
          awk '
            /<\/parent>/ { after_parent = 1 }
            after_parent && !done && /<version>[^<]*<\/version>/ {
              sub(/<version>[^<]*<\/version>/, "<version>IGNORED</version>"); done = 1
            }
            { print }
          ' pom.xml > "$normalized"

          # Si el awk dejara de casar, la version volveria a entrar en la clave y el
          # fallo del 100 % regresaria en silencio, que es justo el defecto que esto cura.
          if ! grep -q '<version>IGNORED</version>' "$normalized"; then
            echo "::error file=pom.xml::No se pudo neutralizar la version del proyecto para la clave de cache de Maven"
            exit 1
          fi

          echo "key=$(sha256sum "$normalized" | cut -c1-40)" >> "$GITHUB_OUTPUT"

      # Antes de `Initialize CodeQL`: con build-mode: none no se compila, pero CodeQL si
      # invoca Maven para resolver el arbol de dependencias, y eso baja el ~/.m2 entero.
      # Hoy este trabajo no llega a arrancar -ver la condicion CODE_SECURITY_ENABLED de
      # arriba-, asi que el cambio es preventivo y no ahorra todavia un solo segundo.
      - name: Restore the Maven repository cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2/repository
          # La version del JDK entra en la clave para que el `restore-keys` no arrastre
          # el ~/.m2 de un JDK anterior cuando se suba de version.
          key: m2-${{ runner.os }}-java${{ env.JAVA_VERSION }}-${{ steps.m2.outputs.key }}
          restore-keys: |
            m2-${{ runner.os }}-java${{ env.JAVA_VERSION }}-

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: java-kotlin
          build-mode: none
          # security-extended añade consultas de precision media sobre el conjunto por
          # defecto. Es asumible aqui porque el resultado no bloquea el pull request:
          # publica alertas.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: "/language:java-kotlin"
