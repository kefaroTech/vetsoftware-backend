name: Publish development image

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  # Bypass acotado (opcion A del diseno de versionado automatico): el permiso de
  # escritura vive solo en este workflow, no en el default del repositorio, que
  # sigue en read. Habilita el commit de bump de version sobre develop y el
  # comentario con la version asignada en el PR que lo origino.
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: backend-publish-dev-image
  cancel-in-progress: false

jobs:
  # La puerta. Antes no existia: este workflow arrancaba con el push a develop y se
  # ponia a construir, mientras `Backend CI` -que es `on: pull_request`- ni siquiera
  # llegaba a dispararse sobre ese evento. No era una carrera que la publicacion
  # ganaba: es que sobre el push no corria nadie. La unica verificacion vivia en el
  # pull request anterior y nada la ataba al commit que se publicaba, asi que un CI
  # en rojo -o directamente en startup_failure, que fue lo que paso con el PR #175- no
  # impedia que la imagen llegara a ECR. Y el `Dockerfile` no ejecuta ninguna prueba
  # -antes compilaba con `-DskipTests`, hoy directamente copia un jar ya hecho-, de modo
  # que el build tampoco iba a encontrar el fallo.
  #
  # Desde que la imagen consume el artefacto `backend-boot-jar` que produce `ci.yml`,
  # este job ademas dejo de ser solo una puerta: es quien construye el binario que se
  # publica. Un `verify` que no suba ese artefacto ya no degrada a "publicar sin
  # verificar", rompe la publicacion entera, que es la direccion correcta del fallo.
  #
  # Se verifica invocando `ci.yml` en vez de copiar aqui sus pasos: si "verificado"
  # tuviera dos definiciones, la de este fichero se quedaria atras el primer dia que
  # alguien anada un gate al CI y nadie se enteraria hasta que la imagen rota
  # estuviera desplegada.
  verify:
    name: Verify before publishing
    if: github.ref == 'refs/heads/develop' && github.actor != 'github-actions[bot]'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Build and publish dev image
    # `needs` es lo que sustituye al `if` sobre una conclusion: un job dependiente no
    # arranca si el que le precede falla o se cancela. No hay forma de escribir mal la
    # condicion ni de publicar con el CI en rojo.
    needs: verify
    # El guard de actor rompe cualquier realimentacion: el commit de version no
    # vuelve a entrar aca. Hoy es redundante -un push hecho con GITHUB_TOKEN no
    # dispara workflows- y deja de serlo el dia que se cambie a una GitHub App.
    if: github.ref == 'refs/heads/develop' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: development
    env:
      CI: true
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      AWS_ROLE_TO_ASSUME: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
      ECR_REPOSITORY: vetsoftware-dev-backend

    steps:
      - name: Check out the verified commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # El commit que acaba de verificar el job `verify`, no `develop` a secas.
          # Es el mismo detalle que obligaria a usar `head_sha` con `workflow_run`:
          # entre la verificacion y este checkout puede haber entrado otro merge, y
          # construir el tip de la rama seria publicar un arbol que nadie verifico.
          # En un push `github.sha` es el commit empujado; en un workflow_dispatch,
          # el tip de la referencia elegida.
          ref: ${{ github.sha }}
          # El bump necesita historia completa para leer los commits del merge y
          # credenciales persistidas para empujar el commit de version.
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      # El orden no es negociable: primero el commit de version, despues el
      # build. Al reves la imagen saldria de un commit cuyo pom todavia declara
      # la version anterior, que es justo la discrepancia que esto elimina.
      - name: Bump development version and push to develop
        id: version
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          outputs="$RUNNER_TEMP/dev-version.env"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          bump() {
            : > "$outputs"
            GITHUB_OUTPUT="$outputs" node .github/scripts/dev-version.mjs apply

            unexpected="$(git diff --name-only | grep -Ev '^(package\.json|package-lock\.json|pom\.xml)$' || true)"
            if [[ -n "$unexpected" ]]; then
              echo "El bump modifico archivos fuera de la version: $unexpected" >&2
              exit 1
            fi

            version="$(sed -n 's/^version=//p' "$outputs")"
            [[ -n "$version" ]] || { echo "dev-version no emitio la version." >&2; exit 1; }

            git add package.json package-lock.json pom.xml
            if git diff --cached --quiet; then
              echo "La version calculada ($version) ya estaba escrita; no hay commit que hacer." >&2
              exit 1
            fi
            git commit -m ":bookmark: chore(version): $version"
          }

          # Una carrera con otro merge solo puede rechazar el push. El rango de
          # commits a evaluar no cambia -sigue siendo el de este merge-, asi que
          # alcanza con recalcular sobre la develop actualizada y reintentar.
          bump
          attempt=1
          until git push origin HEAD:develop; do
            attempt=$((attempt + 1))
            if [[ "$attempt" -gt 3 ]]; then
              echo "No fue posible empujar el commit de version tras 3 intentos." >&2
              exit 1
            fi
            echo "Push rechazado; recalculando sobre develop actualizada (intento $attempt)."
            git fetch origin develop
            git reset --hard origin/develop
            # El reset descarta el commit de version que acabamos de crear, no el
            # merge que lo origino. Si el merge ya no esta en develop, alguien
            # reescribio la rama y publicar esta imagen seria mentir sobre su
            # origen.
            git merge-base --is-ancestor "$GITHUB_SHA" HEAD || {
              echo "El merge $GITHUB_SHA ya no pertenece a develop; se aborta el bump." >&2
              exit 1
            }
            bump
          done

          cat "$outputs" >> "$GITHUB_OUTPUT"
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "tag=dev-$(git rev-parse HEAD | cut -c1-12)"
          } >> "$GITHUB_OUTPUT"

      - name: Validate AWS publication configuration
        shell: bash
        run: |
          [[ -n "$AWS_ROLE_TO_ASSUME" ]] || {
            echo "Configure AWS_ECR_PUBLISH_ROLE_ARN en development con el output del bootstrap dev." >&2
            exit 1
          }

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@451ce2a72e8d729a59ebeaacab82dbce58e7af4c # v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - name: Skip when the immutable tag already exists
        id: existing
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          # Los repositorios son IMMUTABLE: reejecutar sobre una version ya
          # publicada no debe fallar contra ECR.
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_VERSION" \
            --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"

          if [[ -n "$digest" && "$digest" != "None" ]]; then
            echo "push=false" >> "$GITHUB_OUTPUT"
            echo "digest=$digest" >> "$GITHUB_OUTPUT"
            echo "La imagen $IMAGE_VERSION ya existe; se reutiliza su digest."
          else
            echo "push=true" >> "$GITHUB_OUTPUT"
          fi

      # Sigue haciendo falta aunque la imagen ya no compile nada: la etapa runtime es
      # arm64 y su `apt-get install` ejecuta binarios de esa arquitectura sobre un runner
      # amd64. Lo que desaparecio fue la etapa `build`, que ademas era nativa
      # (`FROM --platform=$BUILDPLATFORM`) y por tanto nunca uso esta emulacion.
      - name: Set up QEMU
        if: steps.existing.outputs.push == 'true'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        if: steps.existing.outputs.push == 'true'
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      # El jar que `ci.yml` acaba de construir y verificar sobre este mismo commit. Antes
      # la imagen lo recompilaba entera con Maven dentro del `docker build` -84,7 s por
      # publicacion- para llegar exactamente al mismo binario. El artefacto viaja por el
      # run: `verify` es una llamada a un workflow reutilizable, asi que sus artefactos
      # pertenecen a este run y `download-artifact` los ve sin parametros extra.
      - name: Download the verified boot jar
        if: steps.existing.outputs.push == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-boot-jar
          path: build/docker

      # El `COPY` del Dockerfile apunta a una ruta exacta, no a un glob: dos jars en el
      # directorio se concatenarian en el destino sin un solo aviso y la imagen
      # arrancaria -o no- con un binario imposible de explicar. Aqui se comprueba que
      # llego uno y solo uno, y se le pone el nombre que el `COPY` espera.
      - name: Normalize the jar into the build context
        if: steps.existing.outputs.push == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t jars < <(find build/docker -maxdepth 1 -type f -name '*.jar' | sort)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "Se esperaba exactamente un jar en el artefacto backend-boot-jar; llegaron ${#jars[@]}." >&2
            printf '  %s\n' "${jars[@]+"${jars[@]}"}" >&2
            exit 1
          fi
          if [[ "${jars[0]}" != "build/docker/application.jar" ]]; then
            mv "${jars[0]}" build/docker/application.jar
          fi
          ls -l build/docker/application.jar

      # Dos tags sobre el mismo digest: la version es lo que se pide al
      # desplegar, y el tag del commit es lo que prueba que la imagen salio de
      # este pipeline. El prefijo dev- la separa de los tags sha- de release y la
      # somete a su propia regla de retencion en ECR.
      - name: Build and publish ARM64 development image
        if: steps.existing.outputs.push == 'true'
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.version }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ steps.version.outputs.commit }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            com.vetsoftware.image.run-url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Sin atestaciones el tag apunta a un manifiesto de imagen y no a un
          # index. El escaneo basico de ECR solo escanea manifiestos de
          # plataforma, asi que con provenance y SBOM activos ninguna imagen
          # llegaba a tener escaneo y el gate del despliegue rechazaba todo.
          # Nada en los cuatro repositorios verificaba esas atestaciones.
          provenance: false
          sbom: false
          # El jar entra por el contexto; el valor por defecto del ARG es este mismo, y se
          # declara aqui para que el workflow diga en voz alta que fichero construye en vez
          # de heredarlo en silencio del Dockerfile.
          #
          # APP_VERSION sale de `steps.version.outputs.version`, la MISMA expresion que
          # produce el primer tag de la lista `tags` de este mismo step, y esa es toda la
          # garantia que hace falta: lo que la imagen reporta como `service.version` y lo
          # que dice su tag no pueden divergir, porque salen del mismo output del step de
          # bump. El jar viene del job `verify`, anterior al bump, y lleva horneada la
          # version anterior; esta variable la pisa en runtime sin recompilar nada.
          # APT_SECURITY_REFRESH rompe a proposito el acierto de cache de la capa de apt.
          # El Dockerfile explica por que un acierto ahi publica una imagen con paquetes
          # viejos y el gate de escaneo de ECR acaba rechazando el despliegue.
          build-args: |
            JAR_FILE=build/docker/application.jar
            APP_VERSION=${{ steps.version.outputs.version }}
            APT_SECURITY_REFRESH=${{ github.run_id }}
          # Scope propio. Antes dev y release compartian `backend-arm64`, asi que una
          # release y una publicacion de develop se pisaban las capas mutuamente y cada
          # una invalidaba el acierto de la otra. Los PR de `ci.yml` leen este mismo
          # scope en modo solo lectura: su imagen es la de develop, no la de produccion.
          cache-from: type=gha,scope=backend-arm64-dev
          cache-to: type=gha,mode=max,scope=backend-arm64-dev

      - name: Resolve the published digest
        id: image
        shell: bash
        run: |
          digest="${{ steps.build.outputs.digest }}"
          [[ -n "$digest" ]] || digest="${{ steps.existing.outputs.digest }}"

          if [[ -z "$digest" ]]; then
            echo "No fue posible resolver el digest de la imagen de desarrollo." >&2
            exit 1
          fi

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "uri=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}@${digest}" >> "$GITHUB_OUTPUT"

      # El comentario es lo que vuelve usable el input unico del despliegue:
      # pedir "solo la version" solo funciona si es trivial saber cual toco. El
      # PR se resuelve por API sobre el commit del merge, no parseando su
      # mensaje.
      - name: Comment the assigned version on the merged pull request
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
          BUMP_LEVEL: ${{ steps.version.outputs.level }}
          BUMP_SUBJECT: ${{ steps.version.outputs.subject }}
          BUMP_DEGRADED: ${{ steps.version.outputs.degraded }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].number' 2>/dev/null || true)"
          if [[ -z "$pr" || "$pr" == "null" ]]; then
            echo "El merge no proviene de un pull request; solo queda el resumen del run."
            exit 0
          fi

          reason="$BUMP_SUBJECT"
          if [[ "$BUMP_DEGRADED" == "true" ]]; then
            reason="rango de commits no resuelto; solo avanzó el contador"
          fi

          gh pr comment "$pr" --body "$(cat <<EOF
          ## Versión asignada: \`${IMAGE_VERSION}\`

          - Bump: **${BUMP_LEVEL}**${reason:+ (por \`${reason}\`)}
          - Digest: \`${IMAGE_DIGEST}\`
          - Tags: \`${IMAGE_VERSION}\`, \`${IMAGE_TAG}\`
          - Run: ${RUN_URL}

          Para desplegar en dev: **Deploy backend image dev** en \`VetSoftwareIaC\` → version = \`${IMAGE_VERSION}\`
          EOF
          )"

      - name: Publish the deployable image URI
        env:
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: ${{ steps.version.outputs.tag }}
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          BUMP_LEVEL: ${{ steps.version.outputs.level }}
          VERSION_COMMIT: ${{ steps.version.outputs.commit }}
        shell: bash
        run: |
          {
            echo "## Imagen de desarrollo publicada"
            echo
            echo "| Dato | Valor |"
            echo "|---|---|"
            echo "| Versión | \`${IMAGE_VERSION}\` |"
            echo "| Anterior | \`${PREVIOUS_VERSION}\` (bump ${BUMP_LEVEL}) |"
            echo "| Commit de versión | \`${VERSION_COMMIT}\` |"
            echo "| Tags | \`${IMAGE_VERSION}\`, \`${IMAGE_TAG}\` |"
            echo "| Digest | \`${IMAGE_DIGEST}\` |"
            echo
            echo "Para desplegar: **Deploy backend image dev** en \`VetSoftwareIaC\` con"
            echo "\`version = ${IMAGE_VERSION}\`. El digest se resuelve solo."
            echo
            echo "URI fijada por digest:"
            echo
            echo "\`\`\`"
            echo "${IMAGE_URI}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
