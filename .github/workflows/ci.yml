name: Backend CI

# Solo pull_request. El evento evalua refs/pull/N/merge, que es exactamente el
# arbol que queda en develop despues del merge: revalidarlo en el push posterior
# es correr dos veces la misma verificacion sobre el mismo codigo.
on:
  pull_request:
    branches:
      - develop
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".gitignore"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      container-image: ${{ steps.changes.outputs.docker }}
    env:
      CI: true
      HUSKY: 0

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # La historia completa es lo que permite diferenciar contra la base del
          # pull request y decidir si hay que construir la imagen.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect container image changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail

          # Un workflow_dispatch no trae base contra la que comparar. Se construye
          # la imagen: equivocarse hacia el lado caro es preferible a no verificar
          # un Dockerfile roto en una ejecucion manual.
          if [ -z "$BASE_SHA" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            echo "Ejecucion sin base de comparacion; se construye la imagen."
            exit 0
          fi

          touched="$(git diff --name-only "$BASE_SHA" HEAD -- Dockerfile .dockerignore)"
          if [ -n "$touched" ]; then
            echo "docker=true" >> "$GITHUB_OUTPUT"
            echo "El pull request toca la imagen: $touched"
          else
            echo "docker=false" >> "$GITHUB_OUTPUT"
            echo "Ni Dockerfile ni .dockerignore cambian; no se construye la imagen."
          fi

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Install workflow tooling
        run: npm ci --ignore-scripts

      - name: Audit workflow tooling dependencies
        run: npm audit --audit-level=high

      # Los scripts de .github/scripts deciden que version lleva cada artefacto;
      # un error ahi se paga en el despliegue, no en el build.
      - name: Verify workflow tooling
        run: npm test

      - name: Verify with Maven
        run: mvn --batch-mode --no-transfer-progress verify

  # Solo cuando el pull request toca la imagen. Fuera de ese caso este job
  # reconstruia lo mismo que publish-dev-image publica minutos despues sobre el
  # mismo commit, y el Dockerfile es identico en ambos.
  container-image:
    name: Build ARM64 container image
    needs: verify
    if: needs.verify.outputs.container-image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build production image ephemerally (no ECR)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          tags: vetsoftware/backend:ci
          # Solo lectura de cache. Lo que se escribe desde refs/pull/** queda
          # aislado en el scope de la rama del PR y develop no puede leerlo: seria
          # ocupar presupuesto de cache (4,07 GB de 10 GB) sin acelerar nada.
          cache-from: type=gha,scope=backend-arm64
