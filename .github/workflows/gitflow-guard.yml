name: GitFlow guard

# INF-26. El plan Free con repositorios privados no permite branch protection ni
# rulesets: la API responde 403 "Upgrade to GitHub Pro or make this repository
# public". Sin ese control, nada impide empujar directamente a develop o a main,
# ni abrir un PR desde una rama que no sigue GitFlow.
#
# Este workflow es el sustituto disponible. No PUEDE impedir el push -para eso
# hace falta el plan de pago-, pero lo detecta y deja el commit en rojo, que es
# la diferencia entre una convencion y un control. Cuando se contrate GitHub
# Team, esto pasa a ser un required status check y ya no hay que tocarlo.

on:
  push:
    branches:
      - main
      - develop
  # Sin 'edited': ese tipo dispara con cada cambio de titulo o de cuerpo del PR,
  # que no es nada que este workflow mire. El precio conocido: cambiar la rama
  # destino de un PR ya abierto -lo unico de 'edited' que si afecta a
  # branch-naming- no revalida hasta el siguiente push.
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: gitflow-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Nadie escribe en develop ni en main si no es a traves de un merge de PR.
  # ---------------------------------------------------------------------------
  no-direct-push:
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout de la punta y su padre
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Solo se cuentan los padres del commit de punta: con dos niveles basta
          # y se evita clonar la historia completa en cada push.
          fetch-depth: 2

      - name: Verificar que la punta es un merge de pull request
        env:
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          CREATED: ${{ github.event.created }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # El versionado automatico (chore(version): X.Y.Z-dev.N) commitea sobre
          # develop con el token de Actions. Es un commit de un solo padre y es
          # legitimo: se exceptua por actor, no por mensaje, que es falsificable.
          if [ "$ACTOR" = "github-actions[bot]" ]; then
            echo "::notice::Push de la automatizacion de versionado; exento."
            exit 0
          fi

          if [ "$CREATED" = "true" ]; then
            echo "::notice::Creacion de la rama; nada que verificar."
            exit 0
          fi

          PARENTS=$(git rev-list --parents -n 1 "$SHA" | wc -w)
          # 1 palabra = commit raiz; 2 = un padre; 3+ = merge.
          if [ "$PARENTS" -ge 3 ]; then
            echo "Merge commit en $BRANCH. Correcto."
            exit 0
          fi

          echo "::error title=Push directo a $BRANCH::El commit $SHA no es un merge de pull request."
          cat <<'TXT'

          GitFlow: a develop y a main solo se llega por pull request.

          Para deshacerlo sin perder el trabajo:

              git checkout -b fix/<descripcion> $SHA
              git push -u origin fix/<descripcion>
              git checkout BRANCH_ACTUAL
              git reset --hard origin/BRANCH_ACTUAL~1   # revisar antes de ejecutar
              git push --force-with-lease

          Y abrir el pull request desde la rama nueva.
          TXT
          exit 1

  # ---------------------------------------------------------------------------
  # Las ramas se llaman como manda GitFlow y apuntan a donde deben.
  # ---------------------------------------------------------------------------
  branch-naming:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Validar nombre de rama y rama destino
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          # BE-27. Quien ABRIO el pull request, no quien disparo el evento. Con
          # 'synchronize' en la lista de tipos, github.actor pasa a ser quien empuja
          # -una persona que anade un commit a la rama de Dependabot-, y la excepcion
          # de abajo se caeria en el segundo push. El autor del pull request no
          # cambia nunca y ademas no es falsificable: nadie puede abrir un pull
          # request firmado como dependabot[bot].
          PR_USER: ${{ github.event.pull_request.user.login }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          echo "PR: $HEAD_REF -> $BASE_REF (autor: $PR_USER, actor del evento: $ACTOR)"

          fallo=0

          case "$HEAD_REF" in
            release/*|hotfix/*)
              # Una release o un hotfix cierran contra main. La reintegracion a
              # develop es un PR aparte, y por eso develop tambien es valido.
              if [ "$BASE_REF" != "main" ] && [ "$BASE_REF" != "develop" ]; then
                echo "::error::'$HEAD_REF' debe apuntar a main (y reintegrarse a develop), no a '$BASE_REF'."
                fallo=1
              fi
              ;;
            dependabot/*)
              # BE-27. Dependabot nombra sus ramas dependabot/<ecosistema>/<paquete>-<version>
              # y ese formato no se puede configurar: o se admite el prefijo, o todos
              # sus pull requests nacen en rojo y el mecanismo se abandona en una
              # semana. La excepcion es unicamente para el bot: una rama dependabot/*
              # abierta por una persona sigue siendo un nombre fuera de GitFlow, y se
              # rechaza igual que antes.
              if [ "$PR_USER" != "dependabot[bot]" ]; then
                echo "::error title=Prefijo reservado::'$HEAD_REF' usa el prefijo de Dependabot pero el pull request lo abrio '$PR_USER'."
                echo "::error::El prefijo dependabot/ esta reservado al bot. Renombre la rama con un prefijo de GitFlow."
                fallo=1
              elif [ "$BASE_REF" != "develop" ]; then
                # target-branch: develop en .github/dependabot.yml. Si un pull request
                # de Dependabot apunta a main, esa configuracion se ha movido: main
                # solo recibe releases.
                echo "::error::Las actualizaciones de dependencias se integran en develop, no en '$BASE_REF'."
                echo "::error::Revise target-branch en .github/dependabot.yml."
                fallo=1
              else
                echo "Actualizacion automatica de dependencias; prefijo admitido para dependabot[bot]."
              fi
              ;;
            feature/*|fix/*|perf/*|refactor/*|docs/*|test/*|chore/*|build/*|ci/*|sec/*|style/*)
              if [ "$BASE_REF" != "develop" ]; then
                echo "::error::'$HEAD_REF' debe integrarse en develop, no en '$BASE_REF'."
                echo "::error::Si es un arreglo urgente de produccion, la rama es hotfix/<version>."
                fallo=1
              fi
              ;;
            develop)
              if [ "$BASE_REF" != "main" ]; then
                echo "::error::develop solo se promueve a main."
                fallo=1
              fi
              ;;
            *)
              echo "::error title=Nombre de rama fuera de GitFlow::'$HEAD_REF' no usa ningun prefijo valido."
              cat <<'TXT'

          Prefijos admitidos:

              feature/  fix/  perf/  refactor/  docs/  test/
              chore/    build/ ci/   sec/       style/     -> integran en develop
              release/  hotfix/                            -> cierran contra main
              dependabot/                                  -> reservado a dependabot[bot]

          Renombrar la rama:

              git branch -m <nombre-nuevo>
              git push origin -u <nombre-nuevo>
              git push origin --delete <nombre-viejo>

          TXT
              fallo=1
              ;;
          esac

          [ "$fallo" -eq 0 ] && echo "Rama y destino conformes a GitFlow."
          exit $fallo
