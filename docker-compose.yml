services:
  redis:
    image: redis:7-alpine
    container_name: vetsoftware_redis
    ports:
      - "6379:6379"
    volumes:
      - vetsoftware_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  mysql:
    image: mysql:8.0
    container_name: vetsoftware_mysql
    environment:
      MYSQL_ROOT_PASSWORD: cronos2026*
      MYSQL_DATABASE: vetsoftware_db
      MYSQL_USER: cronos
      MYSQL_PASSWORD: "cronos2026*"
    ports:
      - "3306:3306"
    volumes:
      - vetsoftware_mysql_data:/var/lib/mysql

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: vetsoftware_otel_collector
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./docker/otel-collector.yml:/etc/otel/otel-collector.yml
    ports:
      - "4317:4317"
      - "4318:4318"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - zipkin

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: vetsoftware_zipkin
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus:latest
    container_name: vetsoftware_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:latest
    container_name: vetsoftware_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - vetsoftware_loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: vetsoftware_promtail
    volumes:
      - ./logs:/logs
      - ./docker/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: vetsoftware_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - vetsoftware_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  sonarqube:
    image: sonarqube:lts-community
    container_name: vetsoftware_sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - vetsoftware_sonarqube_data:/opt/sonarqube/data
      - vetsoftware_sonarqube_extensions:/opt/sonarqube/extensions
      - vetsoftware_sonarqube_logs:/opt/sonarqube/logs

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: vetsoftware_gotenberg
    restart: unless-stopped
    ports:
      - "3001:3000"
    command:
      - "gotenberg"
      - "--api-timeout=30s"

  localstack:
    # community 3.x: gratis y con S3 sin token (el tag :latest exige licencia Pro)
    image: localstack/localstack:3
    container_name: vetsoftware_localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      # init script: crea el bucket por defecto al estar lista
      - ./docker/localstack/ready.d:/etc/localstack/init/ready.d

volumes:
  vetsoftware_redis_data:
  vetsoftware_mysql_data:
  vetsoftware_grafana_data:
  vetsoftware_loki_data:
  vetsoftware_sonarqube_data:
  vetsoftware_sonarqube_extensions:
  vetsoftware_sonarqube_logs:
