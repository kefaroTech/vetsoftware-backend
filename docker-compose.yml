services:
  mysql:
    image: mysql:8.0
    container_name: vetsoftware_mysql
    environment:
      MYSQL_ROOT_PASSWORD: cronos2026*
      MYSQL_DATABASE: vetsoftware_db
      MYSQL_USER: cronos
      MYSQL_PASSWORD: "cronos2026*"
    ports:
      - "3306:3306"
    volumes:
      - vetsoftware_mysql_data:/var/lib/mysql

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: vetsoftware_otel_collector
    command: ["--config=/etc/otel/otel-collector.yml"]
    volumes:
      - ./docker/otel-collector.yml:/etc/otel/otel-collector.yml
    ports:
      - "4317:4317"
      - "4318:4318"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - zipkin

  zipkin:
    image: openzipkin/zipkin:latest
    container_name: vetsoftware_zipkin
    ports:
      - "9411:9411"

  prometheus:
    image: prom/prometheus:latest
    container_name: vetsoftware_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:latest
    container_name: vetsoftware_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - vetsoftware_loki_data:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: vetsoftware_promtail
    volumes:
      - ./logs:/logs
      - ./docker/promtail.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: vetsoftware_grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - vetsoftware_grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

volumes:
  vetsoftware_mysql_data:
  vetsoftware_grafana_data:
  vetsoftware_loki_data:
