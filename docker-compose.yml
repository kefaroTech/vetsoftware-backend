services:
  redis:
    image: redis:7-alpine
    container_name: vetsoftware_redis
    ports:
      - "6379:6379"
    volumes:
      - vetsoftware_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning

  mysql:
    image: mysql:8.0
    container_name: vetsoftware_mysql
    environment:
      MYSQL_ROOT_PASSWORD: cronos2026*
      MYSQL_DATABASE: vetsoftware_db
      MYSQL_USER: cronos
      MYSQL_PASSWORD: "cronos2026*"
    ports:
      - "3306:3306"
    volumes:
      - vetsoftware_mysql_data:/var/lib/mysql

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: vetsoftware_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otel/otel-collector.yml"]
    environment:
      OTEL_TAIL_SAMPLING_PERCENTAGE: ${OTEL_TAIL_SAMPLING_PERCENTAGE:-100}
    volumes:
      - ./docker/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      tempo:
        condition: service_healthy

  tempo:
    image: grafana/tempo:3.0.2
    container_name: vetsoftware_tempo
    restart: unless-stopped
    command:
      - -target=all
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./docker/tempo.yml:/etc/tempo/tempo.yml:ro
      - vetsoftware_tempo_data:/var/tempo
    ports:
      # La API de consulta queda limitada al host local; la ingesta OTLP viaja por la red interna.
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD", "/tempo", "-health", "-health.url=http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: vetsoftware_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - vetsoftware_prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:latest
    container_name: vetsoftware_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - vetsoftware_loki_data:/loki

  alloy:
    image: grafana/alloy:v1.18.0
    container_name: vetsoftware_alloy
    restart: unless-stopped
    environment:
      DEPLOYMENT_ENVIRONMENT: ${DEPLOYMENT_ENVIRONMENT:-local}
      SERVICE_NAME: ${OTEL_SERVICE_NAME:-vetsoftware}
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      # Debe coincidir con VETSOFTWARE_LOG_DIR del backend. El valor por defecto
      # es estable y no depende del directorio de trabajo de Java o IntelliJ.
      - ${VETSOFTWARE_LOG_DIR:-${HOME}/.vetsoftware/logs}:/logs:ro
      - ./docker/alloy.alloy:/etc/alloy/config.alloy:ro
      - vetsoftware_alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: vetsoftware_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - vetsoftware_grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/vetsoftware.yml:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_healthy

  sonarqube:
    image: sonarqube:lts-community
    container_name: vetsoftware_sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - vetsoftware_sonarqube_data:/opt/sonarqube/data
      - vetsoftware_sonarqube_extensions:/opt/sonarqube/extensions
      - vetsoftware_sonarqube_logs:/opt/sonarqube/logs

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: vetsoftware_gotenberg
    restart: unless-stopped
    ports:
      - "3001:3000"
    command:
      - "gotenberg"
      - "--api-timeout=30s"

  localstack:
    # community 3.x: gratis y con S3 sin token (el tag :latest exige licencia Pro)
    image: localstack/localstack:3
    container_name: vetsoftware_localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      # init script: crea el bucket por defecto al estar lista
      - ./docker/localstack/ready.d:/etc/localstack/init/ready.d

volumes:
  vetsoftware_redis_data:
  vetsoftware_mysql_data:
  vetsoftware_grafana_data:
  vetsoftware_loki_data:
  vetsoftware_alloy_data:
  vetsoftware_prometheus_data:
  vetsoftware_tempo_data:
  vetsoftware_sonarqube_data:
  vetsoftware_sonarqube_extensions:
  vetsoftware_sonarqube_logs:
