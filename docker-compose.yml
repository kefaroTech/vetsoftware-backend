name: vetsoftware

services:
  redis:
    image: redis:7-alpine
    container_name: vetsoftware_redis
    ports:
      - "${LOCAL_REDIS_PORT:-6379}:6379"
    volumes:
      - vetsoftware_redis_data:/data
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  mysql:
    image: mysql:8.0
    container_name: vetsoftware_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_MYSQL_ROOT_PASSWORD:-cronos2026*}
      MYSQL_DATABASE: ${LOCAL_DB_NAME:-vetsoftware_db}
      MYSQL_USER: ${LOCAL_DB_USERNAME:-cronos}
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:-cronos2026*}
    ports:
      - "${LOCAL_MYSQL_PORT:-3306}:3306"
    volumes:
      - vetsoftware_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: vetsoftware_otel_collector
    restart: unless-stopped
    command: ["--config=/etc/otel/otel-collector.yml"]
    environment:
      OTEL_TAIL_SAMPLING_PERCENTAGE: ${OTEL_TAIL_SAMPLING_PERCENTAGE:-100}
    volumes:
      - ./docker/otel-collector.yml:/etc/otel/otel-collector.yml:ro
    ports:
      - "${LOCAL_OTLP_GRPC_PORT:-4317}:4317"
      - "${LOCAL_OTLP_HTTP_PORT:-4318}:4318"
    depends_on:
      tempo:
        condition: service_healthy
      loki:
        condition: service_started

  tempo:
    image: grafana/tempo:3.0.2
    container_name: vetsoftware_tempo
    restart: unless-stopped
    command:
      - -target=all
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./docker/tempo.yml:/etc/tempo/tempo.yml:ro
      - vetsoftware_tempo_data:/var/tempo
    ports:
      # La API de consulta queda limitada al host local; la ingesta OTLP viaja por la red interna.
      - "127.0.0.1:3200:3200"
    healthcheck:
      test: ["CMD", "/tempo", "-health", "-health.url=http://127.0.0.1:3200/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.13.1
    container_name: vetsoftware_prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-remote-write-receiver
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - vetsoftware_prometheus_data:/prometheus
    secrets:
      - prometheus_metrics_username
      - prometheus_metrics_password
    extra_hosts:
      - "host.docker.internal:host-gateway"

  loki:
    image: grafana/loki:latest
    container_name: vetsoftware_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - vetsoftware_loki_data:/loki

  grafana:
    image: grafana/grafana:latest
    container_name: vetsoftware_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - vetsoftware_grafana_data:/var/lib/grafana
      - ./docker/grafana/provisioning/datasources/datasources.yml:/etc/grafana/provisioning/datasources/vetsoftware.yml:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_healthy

  sonarqube:
    image: sonarqube:lts-community
    container_name: vetsoftware_sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - vetsoftware_sonarqube_data:/opt/sonarqube/data
      - vetsoftware_sonarqube_extensions:/opt/sonarqube/extensions
      - vetsoftware_sonarqube_logs:/opt/sonarqube/logs

  localstack:
    # 3.x conserva el modo local sin cuenta/token. Las versiones 2026 requieren licencia.
    image: localstack/localstack:3
    container_name: vetsoftware_localstack
    restart: unless-stopped
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    environment:
      SERVICES: s3,firehose,iam,sts
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      S3_BUCKET: ${S3_BUCKET:-vetsoftware-local}
      FIREHOSE_STREAM: ${AUDIT_FIREHOSE_DELIVERY_STREAM:-vetsoftware-audit-local}
      PERSISTENCE: "1"
    volumes:
      - ./docker/localstack/ready.d:/etc/localstack/init/ready.d
      - vetsoftware_localstack_data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

secrets:
  prometheus_metrics_username:
    environment: ACTUATOR_PROMETHEUS_USERNAME
  prometheus_metrics_password:
    environment: ACTUATOR_PROMETHEUS_PASSWORD

volumes:
  vetsoftware_redis_data:
  vetsoftware_mysql_data:
  vetsoftware_grafana_data:
  vetsoftware_loki_data:
  vetsoftware_prometheus_data:
  vetsoftware_tempo_data:
  vetsoftware_sonarqube_data:
  vetsoftware_sonarqube_extensions:
  vetsoftware_sonarqube_logs:
  vetsoftware_localstack_data:
