# Almacen de violaciones congeladas de HexagonalArchitectureTest y PiramideDeTestsTest.
#
# Seis de las quince reglas encontraron deuda que ya existia cuando se escribieron.
# En vez de debilitarlas hasta que pasaran, se congelan: lo registrado aqui se
# tolera, cualquier violacion NUEVA rompe el build. El fichero del store se
# versiona, asi que la deuda es visible en el diff y solo puede bajar.
freeze.store.default.path=config/archunit/violation-store

# En false a proposito: si alguien borra el store, el build falla en vez de
# recrearlo en silencio con la foto del dia.
#
# Ojo con lo que este flag NO hace: solo guarda la creacion del DIRECTORIO. Con el
# directorio ya versionado, una regla nueva envuelta en freeze(...) registra su foto
# sola en la primera ejecucion, aunque esto siga en false. Asi que al anadir una
# regla congelada hay que mirar el diff del store y contar las lineas: la deuda
# entra al repo sin avisar. Solo hay que ponerlo en true si el directorio no existe,
# y devolverlo a false en el mismo commit.
freeze.store.default.allowStoreCreation=false
