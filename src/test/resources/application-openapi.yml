# Perfil del volcado del contrato OpenAPI (OpenApiContractIT).
#
# El contexto se levanta ENTERO porque springdoc construye el esquema leyendo los
# handlers registrados: sin controllers reales no hay 564 endpoints que inspeccionar.
# Pero no se habla con ningun servicio externo, asi que todo lo que exige valor para
# arrancar se rellena aqui con literales evidentemente falsos.
#
# Se apila sobre `test` (que trae MySQL de Testcontainers y apaga la telemetria):
# @ActiveProfiles({"test", "openapi"}).
vetsoftware:
  email:
    enabled: false
    from: noreply@test.invalid
    resend:
      api-key: test
  registration:
    verification-base-url: http://localhost/verify
  password-reset:
    reset-base-url: http://localhost/reset
  code-recovery:
    login-url: http://localhost/login
  employee:
    login-url: http://localhost/login
  # Alta de superadministradores de plataforma. Los adaptadores de esta feature declaran default
  # vacio en todos sus @Value, asi que el contexto arrancaria igual sin este bloque; se declara de
  # todas formas porque los perfiles dev y prod SI exigen valor para estas tres claves —arrancar sin
  # aprobador configurado mandaria el enlace a ninguna parte— y este fichero es el espejo de los
  # perfiles. Sin el, anadir manana un @Value sin default aqui tumbaria OpenApiContractIT con un
  # error que no senala a la causa.
  platform-access:
    approver-email: plataforma@test.invalid
    review-base-url: http://localhost/aprobar-acceso
    invitation-base-url: http://localhost/aceptar-invitacion
    login-url: http://localhost/login
  recaptcha:
    enabled: false
    secret: ""
  audit:
    outbox:
      enabled: false
      publisher-enabled: false
      delivery-stream-name: ""
      region: us-east-1
      endpoint: ""
      access-key: ""
      secret-key: ""
  storage:
    s3:
      bucket: test
      region: us-east-1
      endpoint: http://localhost:4566
      access-key: test
      secret-key: test
      path-style-access: true

cors:
  allowed-origins: http://localhost

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: false
