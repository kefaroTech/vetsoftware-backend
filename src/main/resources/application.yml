server:
  servlet:
    context-path: /api/v1
  # 'native' → Tomcat (RemoteIpValve) solo confía en X-Forwarded-For/Proto de proxies INTERNOS de
  # confianza (rangos privados por defecto); un cliente externo no puede falsear su IP. Así
  # request.getRemoteAddr() devuelve la IP real del cliente tanto detrás de balanceador como en local.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: vetsoftware
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/vetsoftware_db
    username: ${DB_USERNAME:cronos}
    password: ${DB_PASSWORD:cronos2026*}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_boolean_jdbc_type: TINYINT
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_SMTP_STARTTLS:false}

jwt:
  secret: ${JWT_SECRET:c2VjcmV0LWtleS12ZXRzb2Z0d2FyZS0yMDI2LXN1cGVyc2VjcmV0LWtleS0xMjM0NTY3ODk=}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

vetsoftware:
  pdf:
    gotenberg:
      url: ${GOTENBERG_URL:http://localhost:3001}
      timeout-seconds: 30
  # vetsoftware.storage.s3 se define por perfil:
  #   - application-dev.yml  → LocalStack
  #   - application-prod.yml → S3 real
  mail:
    from: ${MAIL_FROM:facturacion@vetsoftware.local}
    enabled: ${MAIL_ENABLED:true}
  dian:
    qr-base-url: ${DIAN_QR_BASE_URL:https://catalogo-vpfe.dian.gov.co/document/searchqr?documentkey=}
    # B6 - Datos operativos del documento equivalente POS (Res. 000165/2023). Parametrizar por despliegue con
    # los valores reales del terminal/caja. El cajero (cashier_name) se toma del empleado que emite la venta;
    # 'default-cashier' es el fallback cuando la emisión no tiene actor (cierre de cuenta / procesos de sistema).
    pos:
      terminal-number: ${DIAN_POS_TERMINAL_NUMBER:CJ001}
      cashier-type: ${DIAN_POS_CASHIER_TYPE:Caja principal}
      sales-code: ${DIAN_POS_SALES_CODE:POS01}
      address: ${DIAN_POS_ADDRESS:N/A}
      default-cashier: ${DIAN_POS_DEFAULT_CASHIER:Cajero}
    # Identidad del fabricante del software (VetSoftware) reportada en el documento POS.
    software:
      owner-name: ${DIAN_SOFTWARE_OWNER_NAME:VetSoftware}
      company-name: ${DIAN_SOFTWARE_COMPANY_NAME:VetSoftware}
      name: ${DIAN_SOFTWARE_NAME:VetSoftware}
