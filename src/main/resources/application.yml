spring:
  application:
    name: vetsoftware
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/vetsoftware_db
    username: ${DB_USERNAME:cronos}
    password: ${DB_PASSWORD:cronos2026*}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    database-platform: org.hibernate.dialect.MySQL8Dialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

jwt:
  secret: ${JWT_SECRET:c2VjcmV0LWtleS12ZXRzb2Z0d2FyZS0yMDI2LXN1cGVyc2VjcmV0LWtleS0xMjM0NTY3ODk=}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
