server:
  servlet:
    context-path: /api/v1
  # Tomcat corta en 8KB por defecto. En dev el navegador comparte cookies de otras
  # apps en localhost (NextAuth de :3000/:3003, etc.), inflando el header Cookie por
  # encima de 8KB → Tomcat responde 400 (HTML) antes de llegar al controller. Subimos
  # el límite para tolerarlo. Override por env si hiciera falta.
  max-http-request-header-size: ${MAX_HTTP_HEADER_SIZE:32KB}
  # 'native' → Tomcat (RemoteIpValve) solo confía en X-Forwarded-For/Proto de proxies INTERNOS de
  # confianza (rangos privados por defecto); un cliente externo no puede falsear su IP. Así
  # request.getRemoteAddr() devuelve la IP real del cliente tanto detrás de balanceador como en local.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}
  # Sin esto rige 'immediate': al recibir SIGTERM el conector se cierra de golpe y las peticiones
  # en vuelo se cortan a media respuesta, perdiendo ademas sus lineas de log finales — que son
  # precisamente las que explican que paso durante un despliegue.
  shutdown: ${SERVER_SHUTDOWN:graceful}

spring:
  application:
    name: vetsoftware
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  lifecycle:
    # Presupuesto de apagado, acotado por el stopTimeout=30s de la task de ECS
    # (VetSoftwareIaC/modules/ecs_backend/main.tf): pasado ese plazo llega SIGKILL y no hay
    # segunda oportunidad. El reparto es 15s de drenaje + hasta 10s del flush final del SDK de
    # OpenTelemetry —limite hardcodeado y NO configurable— = 25s, dejando 5s de margen para el
    # resto del cierre. Subir este valor por encima de 20s se come el flush y pierde los ultimos
    # spans y logs exportados, que es el contrario de lo que se busca.
    timeout-per-shutdown-phase: ${SHUTDOWN_PHASE_TIMEOUT:15s}
  # El perfil de carga es casi puro I/O bloqueante: MySQL, Redis, S3, Resend,
  # reCAPTCHA y el proveedor DIAN. Sobre hilos de plataforma, cada peticion
  # esperando red ocupa uno de los 200 de Tomcat sin hacer nada. Con hilos
  # virtuales ese techo desaparece y el costo por tarea baja a kilobytes.
  # Cubre Tomcat, @Async y @Scheduled.
  #
  # Seguro en Java 25: JEP 491 (JDK 24) elimino el pinning por synchronized, asi
  # que los bloques sincronizados de OpenHtmlToPdfEngine no fijan el carrier.
  threads:
    virtual:
      enabled: true
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # Con hilos virtuales el cuello de botella deja de ser el hilo y pasa a ser
    # la conexion, asi que el pool tiene que estar dimensionado a proposito y no
    # por omision.
    #
    # El tamaño NO se sube aqui: lo limita la base, no la aplicacion. En prod la
    # instancia es db.t4g.small (~120-150 conexiones) y el servicio escala a 4
    # tareas, pero deployment_maximum_percent=200 hace convivir viejas y nuevas
    # durante un despliegue: hasta 8 tareas a la vez. Con 30 por tarea eso serian
    # 240 conexiones y cada despliegue tumbaria la base. El margen seguro sobre
    # esa clase ronda las 12 por tarea; se deja en 10 —el efectivo de hoy— hasta
    # tener una medicion, y se sube por variable de entorno sin recompilar.
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:5}
      # Fallar rapido en vez de encolar: una peticion que espera tres segundos
      # por una conexion ya perdio, y encolarla solo propaga la congestion.
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT_MS:3000}
      validation-timeout: 2000
      # Por debajo del wait_timeout de MySQL, para reciclar la conexion nosotros
      # antes de que el servidor la cierre por su cuenta y el pool entregue una
      # conexion muerta.
      max-lifetime: 900000
      keepalive-time: 300000
      # Avisa de una conexion retenida mas de 20 segundos. Es la red que habria
      # delatado el HTTP a la DIAN dentro de la transaccion fiscal.
      leak-detection-threshold: 20000
      pool-name: vetsoftware-hikari
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_boolean_jdbc_type: TINYINT
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    # Sin este valor, Liquibase NO filtra por contexto: un changeSet con context="local,e2e"
    # se aplicaria igual en cualquier entorno, porque "sin --contexts" significa "sin filtro",
    # no "ningun contexto activo" (probado con liquibase-core 5.0.3: 0 changeSets filtrados
    # cuando el valor es null/vacio). `production` es el default seguro que heredan dev y
    # produccion -las dos arrancan con SPRING_PROFILES_ACTIVE=prod (VetSoftwareIaC/
    # environments/{dev,prod}/locals.tf) y ninguna sobreescribe esta clave-, y no coincide con
    # ningun context declarado hoy, asi que todo changeSet local,e2e queda fuera. Solo
    # application-local.yml lo reabre. Ver 262_seed_local_e2e_platform_credential.xml.
    contexts: production
  cache:
    type: redis

# Instrumentación JDBC centrada en la operación SQL. CONNECTION, FETCH y KEYS se
# observan mejor mediante las métricas agregadas de HikariCP y no tienen una
# convención semántica estable de OpenTelemetry.
jdbc:
  includes:
    - QUERY
  datasource-proxy:
    # Política de privacidad: nunca exportar parámetros reales ni duplicar SQL en logs.
    include-parameter-values: false
    query:
      enable-logging: false
  opentelemetry:
    enabled: true
    spans:
      enabled: true
    # Se conservan las métricas de Micrometer/HikariCP. El handler OTel de esta
    # librería añade texto y resumen SQL como tags, lo que elevaría la cardinalidad.
    metrics:
      enabled: false
    analysis:
      enabled: true
      summary:
        enabled: true
      sanitize:
        enabled: true
      cache:
        enabled: true
        max-size: 1000

jwt:
  # Access token corto: se renueva vía refresh token sin re-login (ver /auth/refresh).
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:15}
  # Refresh token largo (opaco, persistido y rotado). Controla cuánto dura la sesión sin re-login.
  refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:30}
  # Un refresh token revocado que vuelve a presentarse es señal de robo y revoca
  # la familia entera del sujeto. Dos pestañas compartiendo la cookie pueden
  # producir el mismo síntoma sin que haya ataque, así que por debajo de este
  # margen se trata como carrera y no se corta la sesión. Ver
  # RefreshAccessTokenService#reactToReuse.
  refresh-reuse-grace-seconds: ${JWT_REFRESH_REUSE_GRACE_SECONDS:10}
  refresh-cookie:
    # El refresh token viaja en cookie HttpOnly para que un XSS no pueda exfiltrar
    # 30 días de acceso. Ver RefreshTokenCookie.
    secure: ${JWT_REFRESH_COOKIE_SECURE:true}
    # Lax basta mientras front y API compartan dominio registrable (kefaro.tech en
    # dev, vetsoftware.co en producción). Si un front pasa a otro dominio —un
    # *.pages.dev, por ejemplo— hay que poner None, y None exige secure=true.
    same-site: ${JWT_REFRESH_COOKIE_SAME_SITE:Lax}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      roles: OBSERVABILITY
  tracing:
    sampling:
      # Política vigente: conservar el 100 %. La aplicación no descarta trazas antes de
      # entregarlas al collector y el pipeline de prod tampoco aplica sampling.
      probability: ${TRACING_SAMPLING:1.0}
  # Las métricas se exponen por Prometheus; no se duplican por OTLP salvo habilitación explícita.
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.version: ${VETSOFTWARE_VERSION:@project.version@}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        vetsoftware.business.dian.transmission.duration: true
      slo:
        http.server.requests: 250ms,500ms,1s,2s,5s
        vetsoftware.business.dian.transmission.duration: 2s,5s,15s,60s
        # Cliente Valkey/Lettuce. El medidor se llama `lettuce`: es el Timer de la observación
        # que crea io.lettuce.core.tracing.MicrometerTracing en CacheConfig, y sale por el
        # registro OTLP, cuya unidad base es el milisegundo. Estos bordes se publican por tanto
        # como le="1","5","25","50","100" (no como fracciones de segundo).
        #
        # Sin bordes intermedios `lettuce_milliseconds_bucket` solo publicaba le="+Inf",
        # histogram_quantile devolvía NaN y `VetSoftwareValkeyLatencyHigh` no podía dispararse
        # nunca. Añadir los bordes es el requisito previo del que habla docs/SLO_VETSOFTWARE.md §5.
        #
        # Bordes SLO y NO `percentiles-histogram: true`, a propósito y con la medida delante:
        # `percentiles-histogram` genera 74 bordes en http.server.requests (medido en Grafana
        # Cloud), así que activarlo aquí serían 5 combinaciones de etiquetas x 74 = 370 series
        # frente a las 5 actuales. Con estos cinco bordes son 5 x 6 = 30. El plan admite 15.000
        # series activas y el uso medido ronda 1.150; `VetSoftwareIngestionNearLimit` existe
        # porque al 100 % Grafana Cloud rechaza la ingesta y se pierde TODA la telemetría en
        # silencio. Con ~45 comandos cada 7 días, la resolución extra de un histograma completo
        # no responde ninguna pregunta que estos bordes no respondan.
        #
        # Por qué exactamente estos cinco valores:
        #  - 50ms es el umbral de VetSoftwareValkeyLatencyHigh. docs/SLO_VETSOFTWARE.md §5: un
        #    umbral que no coincide con un borde publicado obliga a interpolar y el indicador
        #    deja de ser una cuenta de eventos.
        #  - 100ms es obligatorio, no decorativo. histogram_quantile devuelve el borde finito
        #    más alto cuando el cuantil cae en el bucket `+Inf`: si 50ms fuese el techo, el p99
        #    valdría siempre 50 exactos y `> 50` seguiría sin poder dispararse jamás. Cambiar
        #    NaN por un techo de 50 sería cambiar una alerta muerta por otra alerta muerta.
        #  - 1ms y 5ms dan resolución a las operaciones de datos: GET/EVAL/UNLINK miden 1-5 ms
        #    medidos, y sin estos bordes su p99 se interpolaría dentro de un bucket enorme.
        #  - 25ms es el escalón entre esa población y la del saludo de conexión (CLIENT/HELLO,
        #    máximos observados de 60-77 ms), que son dos poblaciones distintas.
        #
        # Efecto colateral asumido: PropertiesMeterFilter resuelve el nombre por jerarquía, así
        # que estos bordes se aplican también al LongTaskTimer `lettuce.active` (+25 series que
        # nadie consulta). Comprobado en vivo: http_server_requests_active_milliseconds_bucket
        # publica los mismos 250/500/1000/2000/5000 declarados para http.server.requests. Se
        # acepta porque evitarlo exige un MeterFilter en Java con su bean y su test para ahorrar
        # 25 series de 15.000. Coste total del cambio: +50 series por instancia del backend.
        lettuce: 1ms,5ms,25ms,50ms,100ms

vetsoftware:
  observability:
    business-metrics:
      initial-delay-ms: ${BUSINESS_METRICS_INITIAL_DELAY_MS:10000}
      snapshot-refresh-ms: ${BUSINESS_METRICS_SNAPSHOT_REFRESH_MS:60000}
    # Sonda de alcanzabilidad de la base (DatabaseAvailabilityProbe). El umbral y el
    # intervalo se multiplican: 4 x 15 s = 60 s antes del ERROR, y la alerta pone
    # encima su propio for: 2m. Subir el intervalo abarata la sonda y retrasa la
    # deteccion en la misma proporcion; bajar el umbral a 1 devuelve el ruido que
    # esta senal existe para quitar.
    database-availability:
      initial-delay-ms: ${DATABASE_PROBE_INITIAL_DELAY_MS:15000}
      probe-interval-ms: ${DATABASE_PROBE_INTERVAL_MS:15000}
      # Por debajo del connection-timeout del pool (3 s): la sonda no debe tardar
      # mas que la peticion de usuario a la que representa.
      validation-timeout-seconds: ${DATABASE_PROBE_VALIDATION_TIMEOUT_SECONDS:2}
      failure-threshold: ${DATABASE_PROBE_FAILURE_THRESHOLD:4}
    actuator:
      authentication:
        enabled: ${ACTUATOR_AUTH_ENABLED:false}
        username: ${ACTUATOR_PROMETHEUS_USERNAME:}
        password: ${ACTUATOR_PROMETHEUS_PASSWORD:}
  pdf:
    max-concurrent-renders: ${PDF_MAX_CONCURRENT_RENDERS:2}
    acquire-timeout: ${PDF_ACQUIRE_TIMEOUT:30s}
    max-html-size: ${PDF_MAX_HTML_SIZE:5MB}
    max-pdf-size: ${PDF_MAX_PDF_SIZE:25MB}
  # Correo saliente vía Resend. Enabled, API key y remitente se definen por perfil.
  email:
    resend:
      base-url: ${RESEND_BASE_URL:https://api.resend.com}
    # Enlaces del pie de los correos (variables de plantilla HELP_URL / PRIVACY_URL / TERMS_URL).
    help-url: ${EMAIL_HELP_URL:https://vetsoftware.co/ayuda}
    privacy-url: ${EMAIL_PRIVACY_URL:https://vetsoftware.co/privacidad}
    terms-url: ${EMAIL_TERMS_URL:https://vetsoftware.co/terminos}
  # Auto-registro público (Opción B): el dueño debe verificar su correo antes de poder iniciar sesión.
  registration:
    # Página del front a la que apunta el enlace del correo; recibe ?token=... y llama a POST /register/verify.
    # Vigencia del enlace de verificación.
    verification-token-ttl-hours: ${REGISTRATION_VERIFICATION_TTL_HOURS:24}
    # ID de la plantilla de Resend para el correo de verificación (variables ADMIN_NAME, COMPANY_NAME,
    # VERIFY_URL, EMPLOYEE_CODE, HELP_URL, PRIVACY_URL, TERMS_URL). El UUID ya NO viaja commiteado como
    # default: llega por variable de entorno, igual que las cuatro de platform-access. Vacío con el
    # correo habilitado (dev y prod) TUMBA EL ARRANQUE, y eso es lo que hace seguro haberlo sacado:
    # ResendVerificationEmailSender lo exige al construirse. Sin esa red, la clave ausente convertía
    # el correo en un descarte silencioso y la cuenta nacía sin poder iniciar sesión.
    verification-template-id: ${REGISTRATION_VERIFICATION_TEMPLATE_ID:}
  # Restablecimiento de contraseña ("olvidé mi contraseña"). Se identifica por employeeCode; el enlace del
  # correo apunta a reset-base-url?token=... y el front llama a POST /auth/reset-password.
  password-reset:
    # Vigencia del enlace de restablecimiento.
    token-ttl-hours: ${PASSWORD_RESET_TTL_HOURS:1}
    # ID de la plantilla de Resend (variables EMPLOYEE_NAME, COMPANY_NAME, EMPLOYEE_CODE, RESET_URL, EMPLOYEE_EMAIL).
    # El UUID ya NO viaja commiteado como default: llega por variable de entorno. Vacío con el correo
    # habilitado (dev y prod) TUMBA EL ARRANQUE: lo exige ResendPasswordResetEmailSender al construirse.
    # Sin esa red, quien perdió su contraseña se quedaba sin ninguna vía de recuperarla y no podía
    # saberlo, porque la respuesta es idéntica por diseño anti-enumeración.
    template-id: ${PASSWORD_RESET_TEMPLATE_ID:}
  # Alta de superadministradores de plataforma por invitacion (incidencia #360). Flujo publico en tres
  # saltos y tres correos: solicitud -> aviso al aprobador -> invitacion (o rechazo) al solicitante.
  # El correo del aprobador y las dos URLs base del front van por perfil (dev/local/prod), porque
  # cambian con el entorno; aqui quedan solo los identificadores de plantilla de Resend.
  # HELP_URL / PRIVACY_URL / TERMS_URL ya los aporta vetsoftware.email de mas arriba: no se duplican.
  platform-access:
    # IDs de plantilla de Resend. Las cuatro plantillas se crean A MANO en el panel de Resend y no
    # las cubre ningun test. El default vacio de aqui NO es la politica: con el correo habilitado
    # (dev y prod), ResendPlatformAccessEmailSender exige las ocho claves de este bloque al
    # construirse y TUMBA EL ARRANQUE si falta una. Antes no lo hacia, y el resultado era que la app
    # levantaba, el endpoint respondia 202, sendTemplate escribia un warning y retornaba, y la
    # solicitud moria sin que nadie se enterase. El vacio solo sobrevive donde el correo esta
    # apagado: contrato OpenAPI, rodajas de test y perfil local.
    # Variables: FULL_NAME, REQUESTER_EMAIL, REASON, REQUESTED_AT, REVIEW_URL + los tres del pie.
    request-template-id: ${PLATFORM_ACCESS_REQUEST_TEMPLATE_ID:}
    # Variables: FULL_NAME, INVITATION_URL + los tres del pie.
    approved-template-id: ${PLATFORM_ACCESS_APPROVED_TEMPLATE_ID:}
    # Variables: FULL_NAME + los tres del pie.
    rejected-template-id: ${PLATFORM_ACCESS_REJECTED_TEMPLATE_ID:}
    # Correo de bienvenida, tras aceptar la invitacion. NO es cortesia: el login de system_users es
    # por `code`, no por correo, asi que sin este correo la cuenta queda creada y su dueño sin saber
    # con que usuario entrar. Variables: FULL_NAME, SYSTEM_USER_CODE, LOGIN_URL + los tres del pie.
    welcome-template-id: ${PLATFORM_ACCESS_WELCOME_TEMPLATE_ID:}
    # Variable LOGIN_URL de ese correo de bienvenida. Apunta a la CONSOLA DE PLATAFORMA
    # (VetSoftwareFront), no a la app del tenant: la cuenta que nace es un superadministrador global.
    # Como las otras URLs del front, su valor real va por perfil; aqui solo queda declarada.
    login-url: ${PLATFORM_ACCESS_LOGIN_URL:}
  token-cleanup:
    enabled: ${TOKEN_CLEANUP_ENABLED:true}
    # Los tokens terminales o expirados se conservan brevemente para diagnóstico y luego se eliminan.
    retention: ${TOKEN_CLEANUP_RETENTION:P7D}
    interval: ${TOKEN_CLEANUP_INTERVAL:PT1H}
    initial-delay: ${TOKEN_CLEANUP_INITIAL_DELAY:PT5M}
    batch-size: ${TOKEN_CLEANUP_BATCH_SIZE:1000}
    max-batches-per-run: ${TOKEN_CLEANUP_MAX_BATCHES_PER_RUN:10}
    growth-warning-threshold: ${TOKEN_CLEANUP_GROWTH_WARNING_THRESHOLD:50000}
  # "Recordar mi código de usuario": por correo se envían todas las cuentas (código + veterinaria) del email.
  # Este correo NO usa plantilla de Resend (el listado es de tamaño variable y superaría el límite de 2.000
  # caracteres por variable): se renderiza en resources/email-templates/recover-code.html y se envía como HTML.
  # reCAPTCHA se configura por perfil; dev/prod exigen un secreto remoto y local lo deshabilita.
  recaptcha:
    verify-url: ${RECAPTCHA_VERIFY_URL:https://www.google.com/recaptcha/api/siteverify}
    # Umbral mínimo para reCAPTCHA v3 (ignorado en v2, que no envía score).
    min-score: ${RECAPTCHA_MIN_SCORE:0.5}
  # Alta de staff por un admin: invitación por correo (plantilla de Resend) con usuario + contraseña temporal.
  employee:
    # ID de la plantilla de Resend del correo de invitación (variables EMPLOYEE_NAME, COMPANY_NAME,
    # EMPLOYEE_CODE, TEMP_PASSWORD, ROLE_NAME, LOGIN_URL, EMPLOYEE_EMAIL). El UUID ya NO viaja commiteado
    # como default: llega por variable de entorno. Vacío con el correo habilitado (dev y prod) TUMBA EL
    # ARRANQUE: lo exige ResendEmployeeInvitationEmailSender al construirse, junto con employee.login-url.
    # Sin esa red el empleado quedaba creado sin conocer su código ni su contraseña temporal, que solo
    # viajan por este correo.
    invitation-template-id: ${EMPLOYEE_INVITATION_TEMPLATE_ID:}
  # Confirmación de cita: al agendar una cita nueva se notifica por correo al propietario (plantilla de Resend).
  appointment:
    # ID de la plantilla de Resend del correo de confirmación (variables RECIPIENT_NAME, RECIPIENT_EMAIL,
    # COMPANY_NAME, APPOINTMENT_DATE, APPOINTMENT_TIME, APPOINTMENT_TYPE, VET_NAME, PET_NAME, BRANCH_NAME,
    # BRANCH_ADDRESS, NOTES). El UUID ya NO viaja commiteado como default: llega por variable de entorno.
    # Vacío con el correo habilitado (dev y prod) TUMBA EL ARRANQUE: lo exige
    # ResendAppointmentConfirmationEmailSender al construirse. Sin esa red la cita quedaba agendada y el
    # propietario no recibía el único acuse de que la cita existe.
    confirmation-template-id: ${APPOINTMENT_CONFIRMATION_TEMPLATE_ID:}
  dian:
    qr-base-url: ${DIAN_QR_BASE_URL:https://catalogo-vpfe.dian.gov.co/document/searchqr?documentkey=}
    # B6 - Datos operativos del documento equivalente POS (Res. 000165/2023). Parametrizar por despliegue con
    # los valores reales del terminal/caja. El cajero (cashier_name) se toma del empleado que emite la venta;
    # 'default-cashier' es el fallback cuando la emisión no tiene actor (cierre de cuenta / procesos de sistema).
    pos:
      terminal-number: ${DIAN_POS_TERMINAL_NUMBER:CJ001}
      cashier-type: ${DIAN_POS_CASHIER_TYPE:Caja principal}
      sales-code: ${DIAN_POS_SALES_CODE:POS01}
      address: ${DIAN_POS_ADDRESS:N/A}
      default-cashier: ${DIAN_POS_DEFAULT_CASHIER:Cajero}
    # Identidad del fabricante del software (VetSoftware) reportada en el documento POS.
    software:
      owner-name: ${DIAN_SOFTWARE_OWNER_NAME:VetSoftware}
      company-name: ${DIAN_SOFTWARE_COMPANY_NAME:VetSoftware}
      name: ${DIAN_SOFTWARE_NAME:VetSoftware}

# Jobs @Scheduled de documento electronico. Van en la raiz `dian` (no bajo `vetsoftware.dian`)
# porque asi los declaran los @Value de ContingencyRetryJob y PendingReconciliationJob.
#
# Los dos ciclos son fixedDelay de 12h: el reloj corre desde que TERMINA la pasada anterior, no
# desde una hora fija del dia. El initial-delay se deja corto a proposito —cada despliegue dispara
# una pasada al minuto o dos—, que es la unica ventana de reintento rapido que queda con 12h.
dian:
  contingency:
    initial-delay-ms: ${DIAN_CONTINGENCY_INITIAL_DELAY_MS:60000}
    retry-delay-ms: ${DIAN_CONTINGENCY_RETRY_DELAY_MS:43200000}
    batch-size: ${DIAN_CONTINGENCY_BATCH_SIZE:25}
    # El lease NO acompaña al ciclo: acota cuanto retiene una replica el lote mientras lo procesa.
    # Corto a proposito, para que un documento no espere 12h si la replica que lo reclamo muere.
    lease: ${DIAN_CONTINGENCY_LEASE:PT30M}
    # Los dos limites estan cuadrados con el ciclo de 12h: la ventana de 48h da para 4 pasadas,
    # y el cap son esas mismas 4. Si cambias uno, recalcula el otro (deadline-hours / 12) o uno
    # de los dos deja de tener efecto.
    max-attempts: ${DIAN_CONTINGENCY_MAX_ATTEMPTS:4}
    deadline-hours: ${DIAN_CONTINGENCY_DEADLINE_HOURS:48}
  reconciliation:
    initial-delay-ms: ${DIAN_RECONCILIATION_INITIAL_DELAY_MS:120000}
    poll-delay-ms: ${DIAN_RECONCILIATION_POLL_DELAY_MS:43200000}
    batch-size: ${DIAN_RECONCILIATION_BATCH_SIZE:50}
    lease: ${DIAN_RECONCILIATION_LEASE:PT15M}
