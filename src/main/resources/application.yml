server:
  servlet:
    context-path: /api/v1
  # 'native' → Tomcat (RemoteIpValve) solo confía en X-Forwarded-For/Proto de proxies INTERNOS de
  # confianza (rangos privados por defecto); un cliente externo no puede falsear su IP. Así
  # request.getRemoteAddr() devuelve la IP real del cliente tanto detrás de balanceador como en local.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:native}

spring:
  application:
    name: vetsoftware
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:25MB}
      max-request-size: ${MAX_REQUEST_SIZE:25MB}
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/vetsoftware_db
    username: ${DB_USERNAME:cronos}
    password: ${DB_PASSWORD:cronos2026*}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        type:
          preferred_boolean_jdbc_type: TINYINT
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis

jwt:
  secret: ${JWT_SECRET:c2VjcmV0LWtleS12ZXRzb2Z0d2FyZS0yMDI2LXN1cGVyc2VjcmV0LWtleS0xMjM0NTY3ODk=}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

vetsoftware:
  pdf:
    gotenberg:
      url: ${GOTENBERG_URL:http://localhost:3001}
      timeout-seconds: 30
  # vetsoftware.storage.s3 se define por perfil:
  #   - application-dev.yml  → LocalStack
  #   - application-prod.yml → S3 real
