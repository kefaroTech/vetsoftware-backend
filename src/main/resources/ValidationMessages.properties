# Mensajes por defecto de Bean Validation, en español y dirigidos al usuario final.
#
# POR QUE EXISTE ESTE FICHERO
# El repositorio declara 831 restricciones en los 162 DTO de web/request y ninguna
# traia `message =`. Sin bundle propio, Hibernate Validator resuelve el mensaje con
# su bundle interno (org.hibernate.validator.ValidationMessages) contra
# Locale.getDefault(), que en el contenedor es la locale POSIX: el front recibia
# "must not be blank" y "size must be between 0 and 100" y los pintaba tal cual bajo
# el control. Este fichero convierte esas 831 en español de una sola vez.
#
# COMO SE RESUELVE
# PlatformResourceBundleLocator busca primero el bundle de usuario `ValidationMessages`
# y solo cae al interno de Hibernate si no encuentra la clave. Al no llevar sufijo de
# idioma, este es el bundle base y responde para CUALQUIER locale: el mensaje ya no
# depende de como arranque la JVM, que es justo lo que lo hacia impredecible.
#
# QUE NO SUSTITUYE
# Esto es la red de seguridad, no el objetivo. Un mensaje de aqui no puede nombrar al
# campo porque lo comparten los 162 DTO ("Este campo es obligatorio"). El sujeto lo
# pone el `message =` explicito del DTO, y el front ademas tiene el `field` del
# ProblemDetail para anclar el error a su control. Al añadir una restriccion nueva,
# escribe su `message` en el DTO; esta linea solo evita que, si se olvida, salga ingles.
#
# Codificacion UTF-8: PropertyResourceBundle lee UTF-8 desde Java 9.

jakarta.validation.constraints.NotNull.message=Este campo es obligatorio.
jakarta.validation.constraints.NotBlank.message=Este campo es obligatorio.
jakarta.validation.constraints.NotEmpty.message=Debes seleccionar al menos una opción.
jakarta.validation.constraints.Null.message=Este campo debe ir vacío.

jakarta.validation.constraints.Size.message=Debe tener entre {min} y {max} caracteres.
jakarta.validation.constraints.Digits.message=Admite hasta {integer} dígitos enteros y {fraction} decimales.

jakarta.validation.constraints.Email.message=El correo electrónico no tiene un formato válido.

# El mensaje por defecto de Hibernate para @Pattern es must match "{regexp}": publica
# la expresion regular entera al cliente, que es estructura interna y no algo que el
# usuario pueda accionar. Se reemplaza por prosa aunque hoy no haya ningun @Pattern en
# el repositorio, para que el dia que se añada uno no filtre.
jakarta.validation.constraints.Pattern.message=El formato de este campo no es válido.

jakarta.validation.constraints.Min.message=El valor mínimo permitido es {value}.
jakarta.validation.constraints.Max.message=El valor máximo permitido es {value}.
jakarta.validation.constraints.DecimalMin.message=El valor mínimo permitido es {value}.
jakarta.validation.constraints.DecimalMax.message=El valor máximo permitido es {value}.
jakarta.validation.constraints.Positive.message=Debe ser un número mayor que cero.
jakarta.validation.constraints.PositiveOrZero.message=No puede ser un número negativo.
jakarta.validation.constraints.Negative.message=Debe ser un número menor que cero.
jakarta.validation.constraints.NegativeOrZero.message=No puede ser un número positivo.

jakarta.validation.constraints.Past.message=La fecha debe ser anterior a hoy.
jakarta.validation.constraints.PastOrPresent.message=La fecha no puede ser futura.
jakarta.validation.constraints.Future.message=La fecha debe ser posterior a hoy.
jakarta.validation.constraints.FutureOrPresent.message=La fecha no puede ser anterior a hoy.

jakarta.validation.constraints.AssertTrue.message=Este campo debe estar aceptado.
jakarta.validation.constraints.AssertFalse.message=Este campo no puede estar aceptado.
