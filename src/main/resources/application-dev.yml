# Perfil dev — idéntico al entorno local actual, pero S3 apunta a LocalStack.
vetsoftware:
  # reCAPTCHA habilitado en dev con las llaves de TEST de Google (siempre validan success:true).
  # Site key para el front: 6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI
  recaptcha:
    enabled: ${RECAPTCHA_ENABLED:true}
    secret: ${RECAPTCHA_SECRET:6LeIxAcTAAAAAGG-vFI1TnRWxMZNFuojJ4WifJWe}
  # En dev el correo Resend está APAGADO por defecto: el registro no requiere API key y el enlace de
  # verificación se escribe en el log (buscar "Enlace de verificación"). Para probar Resend real en dev:
  # EMAIL_ENABLED=true + RESEND_API_KEY=<tu key> (y EMAIL_FROM verificado, o el sandbox de Resend).
  email:
    enabled: ${EMAIL_ENABLED:true}
  # El enlace del correo de verificación apunta a la página del PublicFront (Vite dev en 5174, puerto fijo).
  registration:
    verification-base-url: ${REGISTRATION_VERIFICATION_URL:http://localhost:5174/verify-email}
  storage:
    s3:
      bucket: ${S3_BUCKET:vetsoftware}
      region: ${S3_REGION:us-east-1}
      # endpoint de LocalStack (edge port por defecto)
      endpoint: ${S3_ENDPOINT:http://localhost:4566}
      # LocalStack acepta cualquier credencial; se usan valores de prueba
      access-key: ${S3_ACCESS_KEY:test}
      secret-key: ${S3_SECRET_KEY:test}
      # path-style obligatorio contra LocalStack (no soporta virtual-hosted buckets)
      path-style-access: ${S3_PATH_STYLE_ACCESS:true}
