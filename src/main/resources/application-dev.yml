# Desarrollo compartido: todos los servicios viven fuera del proceso y de la máquina.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  data:
    redis:
      url: ${REDIS_URL}

jwt:
  secret: ${JWT_SECRET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTEL_EXPORTER_OTLP_METRICS_ENDPOINT}
  # Ver nota en application-prod.yml: los logs van por stdout -> CloudWatch -> Firehose, y stdout
  # es la ruta de entrega, no un respaldo. Se apaga también aquí para que este perfil no reviva la
  # doble entrega a Loki si alguna vez llega a activarse (hoy dev arranca con SPRING_PROFILES_ACTIVE=prod).
  logging:
    export:
      enabled: ${OTEL_LOGS_EXPORT_ENABLED:false}
  opentelemetry:
    resource-attributes:
      service.name: vetsoftware
      service.namespace: mainvet
      deployment.environment.name: ${DEPLOYMENT_ENVIRONMENT:development}
      service.instance.id: ${VETSOFTWARE_INSTANCE_ID}
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT}
    logging:
      export:
        schedule-delay: 5s
        max-queue-size: 4096
        max-batch-size: 512
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_LOGS_ENDPOINT}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

vetsoftware:
  email:
    enabled: true
    from: ${EMAIL_FROM}
    resend:
      api-key: ${RESEND_API_KEY}
  registration:
    verification-base-url: ${REGISTRATION_VERIFICATION_URL}
  password-reset:
    reset-base-url: ${PASSWORD_RESET_URL}
  platform-access:
    # Sin default a proposito, como el resto de este perfil: arrancar sin aprobador configurado
    # mandaria el correo de la solicitud a ninguna parte, y nadie se enteraria. Nunca un literal:
    # quien pueda nombrar al aprobador puede aprobarse a si mismo un superadministrador.
    approver-email: ${PLATFORM_APPROVER_EMAIL}
    # Paginas de la consola de plataforma (VetSoftwareFront), no de la app del tenant: reciben
    # ?token=... y llaman a /platform/access-request/approve|reject y a /platform/invitation/accept.
    review-base-url: ${PLATFORM_ACCESS_REVIEW_BASE_URL}
    invitation-base-url: ${PLATFORM_INVITATION_BASE_URL}
    # Tercera pagina de la consola de plataforma, y la mas facil de olvidar. Es el unico canal por
    # el que el superadministrador recien creado conoce su `code`, que es su usuario de login: sin
    # ella el correo de bienvenida sale con un enlace vacio y la cuenta queda inaccesible.
    login-url: ${PLATFORM_ACCESS_LOGIN_URL}
  ai:
    proposal:
      # Deliberado y por encima del suelo de 0,33: dev es trafico nuestro y de las pruebas
      # manuales del embudo, y con 18 invocaciones al dia dos personas probando dejan el
      # asistente degradado toda la tarde —y entonces lo que se prueba no es el producto—.
      # 1,00 USD financia 56 invocaciones: 14 por IP al dia (3 propuestas y 11 refinamientos).
      daily-spend-cap-usd: ${AI_PROPOSAL_DAILY_SPEND_CAP_USD:1.00}
  code-recovery:
    login-url: ${CODE_RECOVERY_LOGIN_URL}
  employee:
    login-url: ${EMPLOYEE_LOGIN_URL}
  recaptcha:
    enabled: ${RECAPTCHA_ENABLED:false}
    secret: ${RECAPTCHA_SECRET:}
  storage:
    s3:
      bucket: ${S3_BUCKET}
      region: ${AWS_REGION}
      endpoint: ${S3_ENDPOINT:}
      access-key: ""
      secret-key: ""
      path-style-access: ${S3_PATH_STYLE_ACCESS:false}
