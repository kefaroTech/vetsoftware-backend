services:
  backend:
    profiles: [application]
    # ANTES DE LEVANTAR ESTO HAY QUE PREPARAR EL JAR. El Dockerfile ya no compila: es una
    # sola etapa que copia un jar ya construido desde build/docker/application.jar, el unico
    # fichero que .dockerignore deja entrar al contexto. Si no esta, el build muere con
    #
    #   ERROR: failed to solve: failed to compute cache key: failed to calculate checksum
    #   of ref ...: "/build/docker/application.jar": not found
    #
    # y no hay forma de personalizar ese mensaje: BuildKit resuelve los origenes de COPY
    # antes de ejecutar nada, asi que no existe ningun paso donde imprimir una explicacion.
    # Por eso la explicacion vive aqui. Los dos comandos son:
    #
    #   mvn --batch-mode -DskipTests package
    #   mkdir -p build/docker && cp target/vetsoftware-*.jar build/docker/application.jar
    #
    # AVISO (INF-34, y esta es la parte que cambio de sitio): ese `mvn package` corre en TU
    # copia de trabajo, que tiene el application-local.yml de verdad -con la contrasena de
    # MySQL-, y Maven lo empaqueta en BOOT-INF/classes. El jar es OPACO para .dockerignore:
    # la exclusion que cerro INF-34 filtraba el CONTEXTO de build, y el secreto ya no pasa
    # por ahi. Una imagen construida asi lleva el perfil local dentro y NO se publica jamas.
    # El montaje de volumes/ de mas abajo es el camino correcto para el perfil local.
    build:
      context: .
      dockerfile: Dockerfile
    image: vetsoftware/backend:local
    container_name: vetsoftware_backend
    restart: unless-stopped
    env_file:
      - path: .env.local
        required: true
    # El perfil `local` NO viaja en la imagen construida por CI: alli el jar sale de un checkout
    # limpio, que no tiene application-local.yml porque esta en .gitignore (INF-34, la contrasena
    # de MySQL acabo en el jar de ECR). OJO: la mitigacion ya NO es el .dockerignore -el jar es
    # opaco para el, ver el aviso del bloque `build` de arriba-, sino donde se empaqueta el jar.
    # Sin este perfil el contenedor arrancaba sin spring.datasource.url ni jwt.secret, porque
    # application.yml no los define. Se monta en runtime: el fichero sigue fuera de la imagen.
    #
    # Las variables de `environment` de abajo son justo los placeholders que ese YAML lee
    # (${DB_URL}, ${REDIS_URL}, ${S3_ENDPOINT}, los OTLP), ya apuntando a los hostnames de la red
    # de compose en vez de a localhost.
    volumes:
      - ./src/main/resources/application-local.yml:/app/config/application-local.yml:ro
    environment:
      SPRING_CONFIG_ADDITIONAL_LOCATION: /app/config/
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:mysql://mysql:3306/${LOCAL_DB_NAME:-vetsoftware_db}
      DB_USERNAME: ${LOCAL_DB_USERNAME:-cronos}
      DB_PASSWORD: ${LOCAL_DB_PASSWORD:-cronos2026*}
      REDIS_URL: redis://redis:6379
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
      OTEL_EXPORTER_OTLP_LOGS_ENDPOINT: http://otel-collector:4318/v1/logs
      MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174
      REGISTRATION_VERIFICATION_URL: http://localhost:5174/verify-email
      PASSWORD_RESET_URL: http://localhost:5174/restablecer-contrasena
      CODE_RECOVERY_LOGIN_URL: http://localhost:5174/login
      EMPLOYEE_LOGIN_URL: http://localhost:5174/login
      S3_ENDPOINT: http://localstack:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - "${LOCAL_BIND_HOST:-127.0.0.1}:${LOCAL_BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "--fail",
          "--silent",
          "--show-error",
          "http://localhost:8080/api/v1/actuator/health/readiness",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  private-front:
    profiles: [application]
    build:
      context: ../VetSoftwareFront
      dockerfile: Dockerfile
      args:
        BUILD_MODE: local
    image: vetsoftware/private-front:local
    container_name: vetsoftware_private_front
    restart: unless-stopped
    ports:
      - "${LOCAL_BIND_HOST:-127.0.0.1}:${LOCAL_PRIVATE_FRONT_PORT:-5173}:8080"
    depends_on:
      backend:
        condition: service_healthy

  public-front:
    profiles: [application]
    build:
      context: ../VetSoftwarePublicFront
      dockerfile: Dockerfile
      args:
        BUILD_MODE: local
    image: vetsoftware/public-front:local
    container_name: vetsoftware_public_front
    restart: unless-stopped
    ports:
      - "${LOCAL_BIND_HOST:-127.0.0.1}:${LOCAL_PUBLIC_FRONT_PORT:-5174}:8080"
    depends_on:
      backend:
        condition: service_healthy
